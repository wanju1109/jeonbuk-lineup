<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>선수 퀴즈 · 출제 도구</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="brand">JEONBUK LAB <span>CREATOR STUDIO</span></span><span class="pill">출제 도구</span></header><section class="hero"><p class="eyebrow">친구에게 보내는 축구 도전장</p><h1>당신의 퀴즈를<br><em>만들어 보세요.</em></h1><p>범위와 난이도를 선택하면 같은 문제가 담긴 참가 링크를 만듭니다.</p></section><section class="panel"><form id="creator"><label>출제 범위<select id="scope"><option value="jb">전북 현대 · 현재 선수</option><option value="history">전북 현대 · 역대 선수</option><option value="k1">K리그1 · 현재 선수</option><option value="all">K리그1 + K리그2 · 현재 선수</option></select></label><label>난이도<select id="level"><option value="easy">하 · 힌트 5개</option><option value="normal" selected>중 · 힌트 3개</option><option value="hard">상 · 힌트 1개</option></select></label><label>문제 수<select id="count"><option value="5">5문제 · 가볍게</option><option value="10" selected>10문제 · 기본</option><option value="20">20문제 · 제대로</option></select></label><p class="muted" id="coverage">선수 정보를 불러오는 중…</p><button class="primary" id="generate" disabled>도전 링크 만들기 ↗</button></form></section><section class="panel" id="output" hidden><h2>도전장이 준비됐어요.</h2><label>참가자용 링크<input id="share-url" readonly></label><div class="actions"><button id="copy" class="primary">참가 링크 복사</button><a id="preview" class="button" target="_blank" rel="noopener">참가 화면 열기 ↗</a></div><label class="embed-label">블로그·웹페이지 삽입 코드<textarea id="embed-code" rows="4" readonly></textarea></label><button id="copy-embed">iframe 코드 복사</button><p class="muted">참가 화면에는 링크·iframe 복사 도구가 표시되지 않습니다. 새로 생성하면 새로운 문제 세트가 만들어집니다.</p></section><p id="status" role="status"></p><footer>이 도구는 화면을 분리한 공개 정적 페이지입니다. 로그인으로 보호되는 관리자 시스템은 아닙니다.<br>비밀 정보나 인증키를 입력하거나 저장하지 않습니다.</footer></main><script src="engine.js"></script><script src="creator.js"></script></body></html>
