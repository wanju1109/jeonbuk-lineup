<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K리그 라운드 분석</title>
<style>
:root {
  --bg:#eef1f4;
  --card:#fff;
  --ink:#14181f;
  --muted:#6b7380;
  --line:#e4e8ee;
  --soft:#f6f7f9;
  --accent:#2563eb;
  --accent-2:#0f172a;
  --k1:#2563eb;
  --k2:#059669;
  --pick:#2563eb;
  --hit:#2563eb;
  --miss:#dc2626;
  --act:#f59e0b;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.05);
  --radius:14px;
}
* { box-sizing:border-box; }
html,body {
  margin:0; background:var(--bg); color:var(--ink); color-scheme:light;
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; line-height:1.45;
}
.wrap { max-width:920px; margin:0 auto; padding:22px 16px 64px; }
h1 { margin:0; font-size:1.28rem; letter-spacing:-.04em; font-weight:800; }
.sub { margin:6px 0 16px; color:var(--muted); font-size:.8rem; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.stat {
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; box-shadow:var(--shadow);
}
.stat b { display:block; color:var(--muted); font-size:.68rem; font-weight:650; }
.stat strong { font-size:1.12rem; letter-spacing:-.03em; }
.bar {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  margin-bottom:12px;
}
.pills {
  display:inline-flex; padding:3px; gap:2px;
  background:#fff; border:1px solid var(--line); border-radius:999px;
  box-shadow:var(--shadow);
}
.pills button {
  appearance:none; border:0; background:transparent; color:var(--muted);
  padding:7px 13px; border-radius:999px; font-size:.8rem; font-weight:700;
  cursor:pointer; line-height:1.2;
}
.pills button.on { background:var(--accent-2); color:#fff; }
.pills.k2 button.on { background:#065f46; }
.bar .action { margin-left:auto; }
.bar .action button {
  background:#fff; color:var(--ink); border:1px solid var(--line);
  border-radius:999px; padding:8px 13px; font-size:.78rem; font-weight:700;
  cursor:pointer; box-shadow:var(--shadow);
}
.bar .action button:hover { border-color:var(--accent); color:var(--accent); }
.rounds {
  margin:0 0 12px; padding:12px; background:var(--card);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
}
.rounds > b { display:block; font-size:.72rem; color:var(--muted); margin:0 0 8px; font-weight:700; }
.rounds > b .hint { font-weight:650; font-size:.65rem; margin-left:6px; }
.rounds .grid { display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:6px; }
.rounds button {
  width:100%; min-height:44px; padding:5px 2px;
  background:var(--soft); color:var(--ink); border:1px solid transparent;
  border-radius:10px; font-size:.76rem; font-weight:750; cursor:pointer; line-height:1.15;
}
.rounds button small { display:block; color:var(--muted); font-size:.55rem; font-weight:650; letter-spacing:-.02em; }
.rounds button.on { background:var(--accent-2); color:#fff; }
.rounds button.on small { color:#cbd5e1; }
.rounds button.live { box-shadow:inset 0 0 0 1.5px var(--accent); }
.legend {
  display:flex; flex-wrap:wrap; gap:12px; margin:0 0 12px;
  color:var(--muted); font-size:.72rem;
}
.legend i {
  display:inline-block; width:16px; height:12px; border-radius:3px;
  vertical-align:-1px; margin-right:4px; border:1px solid #c5ccd6;
}
.legend .l-pick { border:2px solid var(--pick); background:#fff; }
.legend .l-hit { background:var(--hit); border-color:var(--hit); }
.legend .l-act { background:#fde68a; border-color:#f59e0b; }
.list { display:grid; gap:10px; }
.row {
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
}
.head {
  display:grid; grid-template-columns:100px 1fr 80px auto;
  gap:8px; align-items:center; padding:12px 14px;
}
.meta { color:var(--muted); font-size:.72rem; }
.lg { font-weight:800; color:var(--k1); }
.row.k2 .lg { color:var(--k2); }
.teams { font-weight:800; font-size:.98rem; text-align:center; letter-spacing:-.03em; }
.scorebox { text-align:center; }
.scorebox b { display:block; font-size:1.18rem; letter-spacing:.01em; }
.scorebox span { color:var(--muted); font-size:.64rem; }
.btn {
  background:var(--accent-2); color:#fff; border:0; border-radius:9px;
  padding:7px 11px; font-size:.74rem; font-weight:700; cursor:pointer;
}
.btn.ghost { background:#fff; border:1px solid var(--line); color:var(--muted); }
.mkts { padding:0 12px 12px; display:grid; gap:5px; }
.mrow { display:grid; grid-template-columns:68px 1fr 44px; gap:6px; align-items:center; }
.mlab { font-size:.7rem; font-weight:750; color:#64748b; }
.cells { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.cells.two { grid-template-columns:repeat(2,1fr); }
.cell {
  position:relative; background:var(--soft); border:1px solid transparent;
  border-radius:8px; text-align:center; padding:6px 4px 5px;
  font-size:.76rem; font-weight:750; min-height:36px;
}
.cell small { display:block; font-size:.6rem; font-weight:650; color:#94a3b8; }
.cell.pick { border:2px solid var(--pick); background:#fff; }
.cell.pick::before {
  content:"✓"; position:absolute; top:1px; left:4px; font-size:.6rem; color:var(--pick);
}
.cell.actual { background:#fde68a; }
.cell.hit { background:var(--hit); color:#fff; }
.cell.hit small, .cell.hit::before { color:#dbeafe; }
.cell.hit::before { content:"✓"; }
.verdict { font-size:.66rem; font-weight:800; text-align:center; }
.verdict.ok { color:var(--accent); }
.verdict.bad { color:var(--miss); }
.detail { display:none; padding:12px 14px 14px; border-top:1px solid var(--line); background:var(--soft); }
.row.open .detail { display:block; }
.formline { color:var(--muted); font-size:.74rem; margin-bottom:8px; }
.why { display:grid; gap:7px; }
.why p { margin:0; font-size:.8rem; color:#334155; }
.empty { color:var(--muted); padding:32px 4px; text-align:center; }
footer { margin-top:20px; color:var(--muted); font-size:.72rem; }
@media (max-width:720px) {
  .stats { grid-template-columns:1fr 1fr; }
  .head { grid-template-columns:1fr auto; }
  .meta, .teams { text-align:left; }
  .mrow { grid-template-columns:52px 1fr 36px; }
  .rounds .grid { grid-template-columns:repeat(5, minmax(0, 1fr)); }
  .bar .action { margin-left:0; width:100%; }
  .bar .action button { width:100%; }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>K리그 라운드 분석</h1>
  <p class="sub" id="sub">일정·결과는 K리그 데이터. 프로토 회차와 무관합니다.</p>
  <section class="stats" id="stats"></section>
  <nav class="bar" id="bar">
    <div class="pills" id="tabPills">
      <button type="button" class="on" data-tab="up">예정</button>
      <button type="button" data-tab="done">지난 경기</button>
    </div>
    <div class="pills" id="lgPills">
      <button type="button" class="on" data-lg="K1">K리그1</button>
      <button type="button" data-lg="K2">K리그2</button>
    </div>
    <div class="action">
      <button type="button" id="analyzeAll">이 라운드 전부 분석</button>
    </div>
  </nav>
  <nav class="rounds" id="rounds"></nav>
  <p class="legend">
    <span><i class="l-pick"></i>파란 테두리 + 체크 = 내 픽</span>
    <span><i class="l-hit"></i>파란 채움 = 픽이 실제와 같음(적중)</span>
    <span><i class="l-act"></i>노란 채움 = 실제 결과(픽과 다를 때)</span>
    <span>승무패 칸의 숫자는 해외배당</span>
  </p>
  <section class="list" id="list"><p class="empty">불러오는 중…</p></section>
  <footer>
    승무패는 GD 모델 + Pinnacle·라이브스코어 해외배당 보정. U/O 2.5는 포아송 튜닝. 칸 숫자는 통합 해외배당.
    예정 경기는 분석하기를 눌러야 픽이 열립니다.
  </footer>
</main>
<script>
(function () {
  "use strict";

  var MK = [
    ["wdl", "승무패", ["승", "무", "패"]],
    ["ou25", "U/O 2.5", ["언더", "오버"]]
  ];
  var STORE = "kleague_view_open_v1";
  var LS = "https://livescore.co.kr/developer/";
  var state = { data: null, tab: "up", league: "K1", round: null, opened: loadOpened(), lsErr: "" };

  function loadOpened() {
    try { return JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function saveOpened() {
    try { localStorage.setItem(STORE, JSON.stringify(state.opened)); }
    catch (e) {}
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function keyTeam(name) {
    var raw = String(name || "");
    var n = raw.replace(/\s+/g, "").toLowerCase();
    if (n.indexOf("수원삼성") === 0 || n.indexOf("블루윙") >= 0) return "수원삼성";
    if (n === "수원fc" || n.indexOf("수원fc") === 0) return "수원fc";
    n = n.replace(/하나시티즌/g, "하나");
    n = n.replace(/시티즌/g, "");
    n = n.replace(/skfc/g, "sk");
    n = n.replace(/fc1995|1995|2008/g, "");
    n = n.replace(/유나이티드|스틸러스|아이파크|드래곤즈|블루윙즈|상무|현대/g, "");
    n = n.replace(/^fc/, "");
    return n;
  }
  function lsPost(qs) {
    return fetch(LS + "?" + qs, {
      method: "POST",
      headers: { "X-Requested-With": "XMLHttpRequest", "Accept": "*/*" },
      body: "",
      mode: "cors",
      credentials: "omit"
    }).then(function (r) {
      if (!r.ok) throw new Error("livescore " + r.status);
      return r.json();
    });
  }
  function firstVal(block) {
    if (!block || !block[0] || !block[0].v) return null;
    return block[0].v;
  }
  function attachBoardOdds(rows) {
    var map = {};
    (rows || []).forEach(function (row) {
      var lg = row.leagueName === "KOR D1" ? "K1" : row.leagueName === "KOR D2" ? "K2" : "";
      if (!lg) return;
      var od = row.odds_data;
      var wdl = null;
      if (od && od.w && od.d && od.l) {
        wdl = { "승": od.w.v, "무": od.d.v, "패": od.l.v };
      }
      map[lg + "|" + row.date + "|" + keyTeam(row.home_name) + "|" + keyTeam(row.away_name)] = {
        seq: row.seq,
        wdl: wdl
      };
    });
    (state.data.matches || []).forEach(function (m) {
      var hit = map[m.league + "|" + m.date + "|" + keyTeam(m.home) + "|" + keyTeam(m.away)];
      if (hit) m.ls = Object.assign({}, m.ls || {}, hit);
    });
  }
  function loadBoardOdds() {
    return lsPost("process=score_board&sports=soccer").then(function (rows) {
      attachBoardOdds(rows);
      state.lsErr = "";
      var pending = (state.data.matches || []).filter(function (m) {
        return !m.finished && m.ls && m.ls.seq && !m.ls.extra;
      });
      return Promise.all(pending.map(loadExtraOdds));
    }).catch(function (err) {
      state.lsErr = err && err.message ? err.message : "배당 로드 실패";
    });
  }
  function loadExtraOdds(m) {
    if (!m || !m.ls || !m.ls.seq || m.ls.extra) return Promise.resolve();
    var seq = encodeURIComponent(m.ls.seq);
    return Promise.all([
      lsPost("new&seq&process=odds&seq=" + seq + "&kind="),
      lsPost("new&seq&process=odds&seq=" + seq + "&kind=4")
    ]).then(function (arr) {
      m.ls.extra = true;
      var wdl = arr[0] && arr[0].data;
      var ov = wdl ? firstVal(wdl["1"]) : null;
      var dv = wdl ? firstVal(wdl["2"]) : null;
      if (ov) m.ls.wdl = { "승": ov.w, "무": ov.d, "패": ov.l };
      if (dv) m.ls.proto = { "승": dv.w, "무": dv.d, "패": dv.l };
      var ou = arr[1] && arr[1].data ? firstVal(arr[1].data["1"]) : null;
      if (ou) m.ls.ou = ou;
      applyOverseasPicks(m);
    }).catch(function () {});
  }
  function setPick(m, key, lab) {
    if (!m.picks) m.picks = {};
    if (!m.picks[key]) m.picks[key] = {};
    m.picks[key].pick = lab;
  }
  function oddsFavorite(wdl) {
    var best = "승";
    var min = Infinity;
    ["승", "무", "패"].forEach(function (k) {
      var v = Number(wdl[k]);
      if (isFinite(v) && v > 0 && v < min) {
        min = v;
        best = k;
      }
    });
    return { pick: best, min: min };
  }
  function impliedTop(wdl) {
    var inv = {};
    var sum = 0;
    ["승", "무", "패"].forEach(function (k) {
      var v = Number(wdl[k]);
      inv[k] = 1 / (isFinite(v) && v > 0 ? v : 99);
      sum += inv[k];
    });
    var top = 0;
    ["승", "무", "패"].forEach(function (k) {
      top = Math.max(top, inv[k] / sum);
    });
    return top;
  }
  function wdlGap(m) {
    var dist = m.picks && m.picks.wdl && m.picks.wdl.dist;
    if (!dist) return 0;
    var vals = ["승", "무", "패"].map(function (k) { return Number(dist[k] || 0); }).sort(function (a, b) { return b - a; });
    return vals.length > 1 ? vals[0] - vals[1] : vals[0];
  }
  function mergedWdl(m) {
    var od = m.odds;
    if (od && od.wdl) return od.wdl;
    if (m.ls && m.ls.wdl) return m.ls.wdl;
    return null;
  }
  function applyWdlOdds(m) {
    if (!m || m.finished) return;
    if (!m.picks || !m.picks.wdl) return;
    var wdl = mergedWdl(m);
    if (!wdl) return;
    var model = m.picks.wdl.model_pick || m.picks.wdl.pick;
    if (!model) return;
    var fav = oddsFavorite(wdl);
    var top = impliedTop(wdl);
    var gap = wdlGap(m);
    var pick = model;
    if (model === fav.pick) {
      pick = model;
    } else if (fav.min <= 1.80 && top >= 0.44) {
      pick = fav.pick;
    } else if (gap < 0.07 && top >= 0.42) {
      pick = fav.pick;
    }
    setPick(m, "wdl", pick);
  }
  function applyOverseasPicks(m) {
    if (!m || m.finished) return;
    applyWdlOdds(m);
  }
  function cellOdds(m, key, opt) {
    if (key === "wdl") {
      var wdl = mergedWdl(m);
      if (wdl) return wdl[opt] || "";
    }
    var ls = m.ls;
    if (!ls) return "";
    if (key === "ou25" && ls.ou) {
      var tot = Number(ls.ou.p);
      if (Math.abs(tot - 2.5) < 0.01) {
        return opt === "언더" ? (ls.ou.u || "") : (ls.ou.o || "");
      }
    }
    return "";
  }
  function md(d) {
    if (!d) return "";
    var p = String(d).split("-");
    return p.length === 3 ? p[1] + "." + p[2] : d;
  }
  function pctRound(hit, mk) {
    if (!mk) return "-";
    return Math.round((100 * hit) / mk) + "%";
  }
  function currentRound(lg) {
    return (state.data && state.data.current_round && state.data.current_round[lg]) || 1;
  }
  function lastFinishedRound(lg) {
    var stats = roundStats(lg);
    var done = Object.keys(stats).filter(function (r) {
      return stats[r].fin > 0 && stats[r].fin === stats[r].total;
    }).sort(function (a, b) { return Number(a) - Number(b); });
    return done.length ? done[done.length - 1] : pickDefaultRound(lg);
  }

  function visible() {
    var lg = state.league;
    return (state.data.matches || []).filter(function (m) {
      return m.league === lg && String(m.round) === String(state.round);
    });
  }

  function roundStats(lg) {
    var map = {};
    (state.data.matches || []).forEach(function (m) {
      if (m.league !== lg) return;
      var r = String(m.round);
      if (!map[r]) map[r] = { total: 0, fin: 0, wdlHit: 0, wdlMk: 0, ouHit: 0, ouMk: 0 };
      map[r].total += 1;
      if (!m.finished) return;
      map[r].fin += 1;
      map[r].wdlMk += 1;
      if (m.hit && m.hit.wdl) map[r].wdlHit += 1;
      map[r].ouMk += 1;
      if (m.hit && m.hit.ou25) map[r].ouHit += 1;
    });
    return map;
  }

  function pickDefaultRound(lg) {
    var cur = currentRound(lg);
    var stats = roundStats(lg);
    if (stats[String(cur)]) return String(cur);
    var keys = Object.keys(stats).sort(function (a, b) { return Number(a) - Number(b); });
    return keys.length ? keys[keys.length - 1] : "1";
  }

  function paintTabs() {
    document.querySelectorAll("[data-tab]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === state.tab);
    });
    document.querySelectorAll("[data-lg]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-lg") === state.league);
    });
  }

  function roundForTab(lg, tab) {
    if (tab === "done") return lastFinishedRound(lg);
    return String(currentRound(lg));
  }

  function syncTabToRound() {
    var info = roundStats(state.league)[String(state.round)];
    if (!info) return;
    if (info.fin === info.total && info.total > 0) state.tab = "done";
    else if (info.fin === 0) state.tab = "up";
    paintTabs();
  }

  function fillRounds() {
    var lg = state.league;
    var stats = roundStats(lg);
    var rounds = Object.keys(stats).sort(function (a, b) { return Number(a) - Number(b); });
    if (!state.round || !stats[String(state.round)]) {
      state.round = roundForTab(lg, state.tab);
    }
    var html = "<b>라운드 <span class=\"hint\">승무패 / U/O</span></b><div class=\"grid\">";
    rounds.forEach(function (r) {
      var info = stats[r];
      var done = info.fin > 0 && info.fin === info.total;
      var live = info.fin > 0 && info.fin < info.total;
      var rate = "";
      if (info.fin > 0 && (info.wdlMk > 0 || info.ouMk > 0)) {
        rate = "<small>" + pctRound(info.wdlHit, info.wdlMk) + "/" + pctRound(info.ouHit, info.ouMk) + "</small>";
      }
      var cls = [];
      if (String(state.round) === String(r)) cls.push("on");
      if (live || (!done && info.fin === 0 && Number(r) === currentRound(lg))) cls.push("live");
      html += '<button type="button" data-round="' + esc(r) + '" class="' + cls.join(" ") + '">' +
        esc(r) + "R" + rate + "</button>";
    });
    html += "</div>";
    document.getElementById("rounds").innerHTML = html;
  }

  function renderStats() {
    var s = (state.data.summary || {})[state.league] || {};
    var hits = s.hits || {};
    function box(label, key) {
      var h = hits[key] || {};
      return '<div class="stat"><b>' + label + "</b><strong>" +
        (h.rate != null ? h.rate : "-") + "%</strong></div>";
    }
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + (state.league === "K1" ? "K리그1" : "K리그2") +
      " 현재</b><strong>" + currentRound(state.league) + "R</strong></div>" +
      box("승무패 적중", "wdl") +
      box("U/O 2.5 적중", "ou25");
    document.getElementById("sub").textContent =
      (state.data.season ? state.data.season + "시즌 · " : "") +
      "생성 " + (state.data.generated_at || "-") +
      " · 지난 경기는 예측과 실제를 같이 표시, 예정 경기는 분석하기를 누를 때 공개";
  }

  function marketRow(m, key, label, opts) {
    var p = (m.picks && m.picks[key]) || {};
    var pick = p.pick;
    var actual = m.finished && m.actual ? m.actual[key] : null;
    var cells = opts.map(function (opt) {
      var cls = ["cell"];
      var isPick = pick === opt;
      var isAct = actual === opt;
      if (isPick && isAct) cls.push("hit");
      else if (isPick) cls.push("pick");
      else if (isAct) cls.push("actual");
      var odds = cellOdds(m, key, opt);
      var pr = odds ? "<small>" + esc(odds) + "</small>" : "";
      return '<div class="' + cls.join(" ") + '">' + esc(opt) + pr + "</div>";
    }).join("");
    var verdict = "";
    if (m.finished && actual) {
      var ok = pick === actual;
      verdict = '<div class="verdict ' + (ok ? "ok" : "bad") + '">' +
        (ok ? "적중" : "미적중") + "</div>";
    }
    return (
      '<div class="mrow">' +
        '<div class="mlab">' + esc(label) + "</div>" +
        '<div class="cells' + (opts.length === 2 ? " two" : "") + '">' + cells + "</div>" +
        verdict +
      "</div>"
    );
  }

  function marketsHtml(m) {
    return '<div class="mkts">' + MK.map(function (x) {
      return marketRow(m, x[0], x[1], x[2]);
    }).join("") + "</div>";
  }

  function oddsLine(m) {
    var od = m.odds;
    var ls = m.ls;
    var parts = [];
    if (od && od.wdl) {
      var src = (od.sources || []).join("+") || "해외";
      parts.push(src + " " + od.wdl["승"] + " / " + od.wdl["무"] + " / " + od.wdl["패"]);
    } else if (ls && ls.wdl) {
      parts.push("해외 " + ls.wdl["승"] + " / " + ls.wdl["무"] + " / " + ls.wdl["패"]);
    }
    if (ls && ls.proto) {
      parts.push("국내 " + ls.proto["승"] + " / " + ls.proto["무"] + " / " + ls.proto["패"]);
    }
    if (ls && ls.ou && Math.abs(Number(ls.ou.p) - 2.5) < 0.01) {
      parts.push("U/O 2.5 " + ls.ou.u + "/" + ls.ou.o);
    }
    if (!parts.length) {
      return state.lsErr
        ? '<div class="formline">해외배당을 불러오지 못했다. (' + esc(state.lsErr) + ")</div>"
        : "";
    }
    var tag = "";
    if (!m.finished && m.picks && m.picks.wdl && m.picks.wdl.odds_tag) {
      tag = " · 승무패 보정 " + esc(m.picks.wdl.odds_tag);
    }
    return '<div class="formline">배당 ' + esc(parts.join(" · ")) + tag + "</div>";
  }
  function detailHtml(m) {
    var form = m.form || {};
    var paras = ((m.reason && m.reason.paragraphs) || []).filter(function (p) {
      var s = String(p);
      if (s.indexOf("칸에 보이는") >= 0) return false;
      if (s.indexOf("핸디캡 홈") === 0) return false;
      if (s.indexOf("언더오버 3.5") === 0) return false;
      return true;
    }).map(function (p) {
      return "<p>" + esc(p) + "</p>";
    }).join("");
    return (
      '<div class="formline">킥오프 전 폼 홈 ' + esc(form.home || "-") +
      " (" + esc(form.home_record || "-") + ", 승점 " + esc(form.home_pts) +
      ") · 원정 " + esc(form.away || "-") + " (" + esc(form.away_record || "-") +
      ", 승점 " + esc(form.away_pts) + ")" +
      (m.xg && m.xg.home != null ? " · 기대득점 " + m.xg.home + "-" + m.xg.away : "") +
      "</div>" +
      oddsLine(m) +
      '<div class="why">' + paras + "</div>"
    );
  }

  function rowHtml(m) {
    var open = !!state.opened[m.id];
    var showMk = m.finished || open;
    var score = m.finished && m.score ? m.score[0] + ":" + m.score[1] : "—";
    var scoreCap = m.finished ? "결과" : (m.time || "예정");
    var btn = m.finished
      ? '<button type="button" class="btn ghost" data-toggle="' + esc(m.id) + '">' +
        (open ? "접기" : "근거") + "</button>"
      : (open
        ? '<button type="button" class="btn ghost" data-toggle="' + esc(m.id) + '">접기</button>'
        : '<button type="button" class="btn" data-open="' + esc(m.id) + '">분석하기</button>');
    return (
      '<article class="row ' + (m.league === "K2" ? "k2" : "k1") + (open ? " open" : "") + '">' +
        '<div class="head">' +
          '<div class="meta"><span class="lg">' + esc(m.league) + " " + esc(m.round) + "R</span><br>" +
            esc(md(m.date)) + (m.time ? " " + esc(m.time) : "") +
            (m.venue ? "<br>" + esc(m.venue) : "") + "</div>" +
          '<div class="teams">' + esc(m.home) + " vs " + esc(m.away) + "</div>" +
          '<div class="scorebox"><span>' + esc(scoreCap) + "</span><b>" + esc(score) + "</b></div>" +
          btn +
        "</div>" +
        (showMk ? marketsHtml(m) : "") +
        (open ? '<div class="detail">' + detailHtml(m) + "</div>" : "") +
      "</article>"
    );
  }

  function render() {
    paintTabs();
    fillRounds();
    renderStats();
    var rows = visible();
    document.getElementById("analyzeAll").style.display = state.tab === "up" ? "" : "none";
    if (!rows.length) {
      document.getElementById("list").innerHTML = '<p class="empty">해당 조건의 경기가 없습니다.</p>';
      return;
    }
    document.getElementById("list").innerHTML = rows.map(rowHtml).join("");
  }

  document.querySelector(".bar").addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.getAttribute("data-tab")) {
      state.tab = t.getAttribute("data-tab");
      state.round = roundForTab(state.league, state.tab);
      render();
      return;
    }
    if (t.getAttribute("data-lg")) {
      state.league = t.getAttribute("data-lg");
      state.round = roundForTab(state.league, state.tab);
      render();
      return;
    }
    if (t.id === "analyzeAll") {
      var rows = visible();
      rows.forEach(function (m) { state.opened[m.id] = true; });
      saveOpened();
      Promise.all(rows.map(loadExtraOdds)).then(render);
    }
  });
  document.getElementById("rounds").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-round]");
    if (!btn) return;
    state.round = btn.getAttribute("data-round");
    syncTabToRound();
    render();
  });
  document.getElementById("list").addEventListener("click", function (ev) {
    var open = ev.target.getAttribute("data-open");
    var tog = ev.target.getAttribute("data-toggle");
    var id = open || tog;
    if (!id) return;
    if (open) state.opened[id] = true;
    else state.opened[id] = !state.opened[id];
    if (!state.opened[id]) delete state.opened[id];
    saveOpened();
    var m = (state.data.matches || []).filter(function (x) { return x.id === id; })[0];
    if (state.opened[id] && m) loadExtraOdds(m).then(render);
    else render();
  });

  fetch("data/league.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("league.json " + r.status);
      return r.json();
    })
    .then(function (data) {
      state.data = data;
      state.round = roundForTab(state.league, state.tab);
      render();
      return loadBoardOdds().then(render);
    })
    .catch(function (err) {
      document.getElementById("list").innerHTML =
        '<p class="empty">data/league.json 을 불러오지 못했습니다. (' + esc(err.message) + ")</p>";
    });
})();
</script>
</body>
</html>
