<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K리그 라운드 분석</title>
<style>
:root {
  --bg:#f0f2f5; --card:#fff; --soft:#f7f8fa; --line:#d8dee6;
  --text:#1b2430; --muted:#66768a; --k1:#1d4f91; --k2:#1a7a4c;
  --pick:#1d6fe8; --hit:#1d6fe8; --miss:#c43c4b; --btn:#1d6fe8;
}
* { box-sizing:border-box; }
html,body {
  margin:0; background:var(--bg); color:var(--text); color-scheme:light;
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; line-height:1.4;
}
.wrap { max-width:980px; margin:0 auto; padding:16px 12px 56px; }
h1 { margin:0; font-size:1.22rem; letter-spacing:-.03em; }
.sub { margin:4px 0 12px; color:var(--muted); font-size:.8rem; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
.stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.stat b { display:block; color:var(--muted); font-size:.68rem; }
.stat strong { font-size:1.1rem; }
.bar {
  display:grid; gap:8px; margin-bottom:10px;
  background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px;
}
.bar .group { display:grid; grid-template-columns:64px 1fr; gap:8px; align-items:center; }
.bar .group > span { font-size:.72rem; font-weight:800; color:var(--muted); }
.bar .seg {
  display:grid; grid-template-columns:1fr 1fr; gap:0;
  border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#f4f7fb;
}
.bar .seg button {
  background:transparent; color:var(--text); border:0; border-right:1px solid var(--line);
  padding:9px 10px; font-size:.82rem; font-weight:700; cursor:pointer;
}
.bar .seg button:last-child { border-right:0; }
.bar .seg button.on { background:#1d4f91; color:#fff; }
.bar .seg button.k2.on { background:#1a7a4c; }
.bar .action { display:flex; justify-content:flex-end; }
.bar .action button {
  background:#fff; color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:9px 14px; font-size:.8rem; font-weight:700; cursor:pointer;
}
.bar .action button:hover { border-color:#1d6fe8; color:#1d6fe8; }
.rounds {
  margin:0 0 10px; padding:8px; background:#fff;
  border:1px solid var(--line); border-radius:8px;
}
.rounds > b { display:block; font-size:.75rem; color:var(--muted); margin:0 0 6px; }
.rounds .grid {
  display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:5px;
}
.rounds button {
  width:100%; min-height:44px; padding:4px 2px;
  background:#f4f7fb; color:var(--text); border:1px solid var(--line);
  border-radius:6px; font-size:.78rem; font-weight:800; cursor:pointer; line-height:1.15;
}
.rounds button small { display:block; color:var(--muted); font-size:.62rem; font-weight:700; }
.rounds button.on { background:#1d4f91; color:#fff; border-color:#1d4f91; }
.rounds button.on small { color:#c9dbf5; }
.rounds button.live { border-color:#1d6fe8; }
.legend {
  display:flex; flex-wrap:wrap; gap:10px; margin:0 0 10px;
  color:var(--muted); font-size:.72rem;
}
.legend i {
  display:inline-block; width:18px; height:14px; border-radius:3px;
  vertical-align:-2px; margin-right:4px; border:1px solid #bbb;
}
.legend .l-pick { border:2px solid var(--pick); background:#fff; }
.legend .l-hit { background:var(--hit); border-color:var(--hit); }
.legend .l-act { background:#f3d9a8; border-color:#d4a24a; }
.list { display:grid; gap:8px; }
.row { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.head {
  display:grid; grid-template-columns:92px 1fr 88px auto;
  gap:8px; align-items:center; padding:8px 10px; background:#f0f4fa;
  border-bottom:1px solid var(--line);
}
.meta { color:var(--muted); font-size:.72rem; }
.lg { font-weight:800; color:var(--k1); }
.row.k2 .lg { color:var(--k2); }
.teams { font-weight:800; font-size:.95rem; text-align:center; }
.scorebox { text-align:center; }
.scorebox b { display:block; font-size:1.15rem; letter-spacing:.02em; }
.scorebox span { color:var(--muted); font-size:.66rem; }
.btn {
  background:var(--btn); color:#fff; border:0; border-radius:6px;
  padding:6px 10px; font-size:.75rem; font-weight:700; cursor:pointer;
}
.btn.ghost { background:#fff; border:1px solid var(--line); color:var(--muted); }
.mkts { padding:6px 8px 8px; display:grid; gap:4px; }
.mrow { display:grid; grid-template-columns:72px 1fr 44px; gap:6px; align-items:center; }
.mlab { font-size:.72rem; font-weight:800; color:#4a5a6c; }
.cells { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.cells.two { grid-template-columns:repeat(2,1fr); }
.cell {
  position:relative; background:#fff; border:1px solid #c9d4e2; border-radius:4px;
  text-align:center; padding:5px 4px 4px; font-size:.78rem; font-weight:700; min-height:34px;
}
.cell small { display:block; font-size:.62rem; font-weight:600; color:#7b8b9c; }
.cell.pick { border:2px solid var(--pick); }
.cell.pick::before {
  content:"✓"; position:absolute; top:0; left:3px; font-size:.62rem; color:var(--pick);
}
.cell.actual { background:#f3d9a8; border-color:#d4a24a; }
.cell.hit {
  background:var(--hit); border-color:var(--hit); color:#fff;
}
.cell.hit small, .cell.hit::before { color:#d7e7ff; }
.cell.hit::before { content:"✓"; }
.verdict { font-size:.68rem; font-weight:800; text-align:center; }
.verdict.ok { color:#1d6fe8; }
.verdict.bad { color:var(--miss); }
.detail { display:none; padding:8px 10px 10px; border-top:1px solid var(--line); background:#fafcfe; }
.row.open .detail { display:block; }
.formline { color:var(--muted); font-size:.74rem; margin-bottom:8px; }
.why { display:grid; gap:6px; }
.why p { margin:0; font-size:.8rem; color:#334155; }
.empty { color:var(--muted); padding:28px 4px; }
footer { margin-top:18px; color:var(--muted); font-size:.72rem; }
@media (max-width:720px) {
  .stats { grid-template-columns:1fr 1fr; }
  .head { grid-template-columns:1fr auto; }
  .meta, .teams { text-align:left; }
  .mrow { grid-template-columns:56px 1fr 36px; }
  .rounds .grid { grid-template-columns:repeat(5, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<main class="wrap">
  <h1>K리그 라운드 분석</h1>
  <p class="sub" id="sub">일정·결과는 K리그 데이터. 프로토 회차와 무관합니다.</p>
  <section class="stats" id="stats"></section>
  <nav class="bar" id="bar">
    <div class="group">
      <span>경기</span>
      <div class="seg">
        <button type="button" class="on" data-tab="up">예정 경기</button>
        <button type="button" data-tab="done">지난 경기</button>
      </div>
    </div>
    <div class="group">
      <span>리그</span>
      <div class="seg">
        <button type="button" class="on" data-lg="K1">K리그1</button>
        <button type="button" class="k2" data-lg="K2">K리그2</button>
      </div>
    </div>
    <div class="action">
      <button type="button" id="analyzeAll">이 라운드 전부 분석</button>
    </div>
  </nav>
  <nav class="rounds" id="rounds"></nav>
  <p class="legend">
    <span><i class="l-pick"></i>파란 테두리 + 체크 = 내 픽</span>
    <span><i class="l-hit"></i>파란 채움 = 픽이 실제와 같음(적중)</span>
    <span><i class="l-act"></i>노란 채움 = 실제 결과(픽과 다를 때)</span>
  </p>
  <section class="list" id="list"><p class="empty">불러오는 중…</p></section>
  <footer>
    모델: 킥오프 이전 공격/수비·최근 폼·홈 이점 포아송. 핸디캡은 홈팀 기준.
    예정 경기는 분석하기를 눌러야 픽이 열립니다.
  </footer>
</main>
<script>
(function () {
  "use strict";

  var MK = [
    ["wdl", "승무패", ["승", "무", "패"]],
    ["h_p1", "H+1", ["승", "무", "패"]],
    ["h_p2", "H+2", ["승", "무", "패"]],
    ["h_m1", "H-1", ["승", "무", "패"]],
    ["h_m2", "H-2", ["승", "무", "패"]],
    ["ou25", "U/O 2.5", ["언더", "오버"]],
    ["ou35", "U/O 3.5", ["언더", "오버"]]
  ];
  var STORE = "kleague_view_open_v1";
  var state = { data: null, tab: "up", league: "K1", round: null, opened: loadOpened() };

  function loadOpened() {
    try { return JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function saveOpened() {
    try { localStorage.setItem(STORE, JSON.stringify(state.opened)); }
    catch (e) {}
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function pct(v) {
    if (v == null || v === "") return "";
    return (Number(v) * 100).toFixed(0) + "%";
  }
  function md(d) {
    if (!d) return "";
    var p = String(d).split("-");
    return p.length === 3 ? p[1] + "." + p[2] : d;
  }
  function currentRound(lg) {
    return (state.data && state.data.current_round && state.data.current_round[lg]) || 1;
  }
  function lastFinishedRound(lg) {
    var stats = roundStats(lg);
    var done = Object.keys(stats).filter(function (r) {
      return stats[r].fin > 0 && stats[r].fin === stats[r].total;
    }).sort(function (a, b) { return Number(a) - Number(b); });
    return done.length ? done[done.length - 1] : pickDefaultRound(lg);
  }

  function visible() {
    var lg = state.league;
    return (state.data.matches || []).filter(function (m) {
      return m.league === lg && String(m.round) === String(state.round);
    });
  }

  function roundStats(lg) {
    var map = {};
    (state.data.matches || []).forEach(function (m) {
      if (m.league !== lg) return;
      var r = String(m.round);
      if (!map[r]) map[r] = { total: 0, fin: 0, hit: 0, mk: 0 };
      map[r].total += 1;
      if (!m.finished) return;
      map[r].fin += 1;
      MK.forEach(function (x) {
        map[r].mk += 1;
        if (m.hit && m.hit[x[0]]) map[r].hit += 1;
      });
    });
    return map;
  }

  function pickDefaultRound(lg) {
    var cur = currentRound(lg);
    var stats = roundStats(lg);
    if (stats[String(cur)]) return String(cur);
    var keys = Object.keys(stats).sort(function (a, b) { return Number(a) - Number(b); });
    return keys.length ? keys[keys.length - 1] : "1";
  }

  function syncTabToRound() {
    var info = roundStats(state.league)[String(state.round)];
    if (!info) return;
    if (info.fin === info.total && info.total > 0) state.tab = "done";
    else if (info.fin === 0) state.tab = "up";
    document.querySelectorAll("[data-tab]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === state.tab);
    });
  }

  function fillRounds() {
    var lg = state.league;
    var stats = roundStats(lg);
    var rounds = Object.keys(stats).sort(function (a, b) { return Number(a) - Number(b); });
    if (!state.round || !stats[String(state.round)]) {
      state.round = pickDefaultRound(lg);
    }
    var html = "<b>라운드</b><div class=\"grid\">";
    rounds.forEach(function (r) {
      var info = stats[r];
      var done = info.fin > 0 && info.fin === info.total;
      var live = info.fin > 0 && info.fin < info.total;
      var rate = "";
      if (info.fin > 0 && info.mk > 0) {
        rate = "<small>" + Math.round((100 * info.hit) / info.mk) + "%</small>";
      }
      var cls = [];
      if (String(state.round) === String(r)) cls.push("on");
      if (live || (!done && info.fin === 0 && Number(r) === currentRound(lg))) cls.push("live");
      html += '<button type="button" data-round="' + esc(r) + '" class="' + cls.join(" ") + '">' +
        esc(r) + "R" + rate + "</button>";
    });
    html += "</div>";
    document.getElementById("rounds").innerHTML = html;
  }

  function renderStats() {
    var s = (state.data.summary || {})[state.league] || {};
    var hits = s.hits || {};
    function box(label, key) {
      var h = hits[key] || {};
      return '<div class="stat"><b>' + label + "</b><strong>" +
        (h.rate != null ? h.rate : "-") + "%</strong></div>";
    }
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + (state.league === "K1" ? "K리그1" : "K리그2") +
      " 현재</b><strong>" + currentRound(state.league) + "R</strong></div>" +
      box("승무패 적중", "wdl") +
      box("H+1 적중", "h_p1") +
      box("U/O 2.5 적중", "ou25");
    document.getElementById("sub").textContent =
      "2026시즌 · 생성 " + (state.data.generated_at || "-") +
      " · 지난 경기는 예측과 실제를 같이 표시, 예정 경기는 분석하기를 누를 때 공개";
  }

  function marketRow(m, key, label, opts) {
    var p = (m.picks && m.picks[key]) || {};
    var pick = p.pick;
    var actual = m.finished && m.actual ? m.actual[key] : null;
    var dist = p.dist || {};
    var cells = opts.map(function (opt) {
      var cls = ["cell"];
      var isPick = pick === opt;
      var isAct = actual === opt;
      if (isPick && isAct) cls.push("hit");
      else if (isPick) cls.push("pick");
      else if (isAct) cls.push("actual");
      var pr = dist[opt] != null ? "<small>" + pct(dist[opt]) + "</small>" : "";
      return '<div class="' + cls.join(" ") + '">' + esc(opt) + pr + "</div>";
    }).join("");
    var verdict = "";
    if (m.finished && actual) {
      var ok = pick === actual;
      verdict = '<div class="verdict ' + (ok ? "ok" : "bad") + '">' +
        (ok ? "적중" : "미적중") + "</div>";
    }
    return (
      '<div class="mrow">' +
        '<div class="mlab">' + esc(label) + "</div>" +
        '<div class="cells' + (opts.length === 2 ? " two" : "") + '">' + cells + "</div>" +
        verdict +
      "</div>"
    );
  }

  function marketsHtml(m) {
    return '<div class="mkts">' + MK.map(function (x) {
      return marketRow(m, x[0], x[1], x[2]);
    }).join("") + "</div>";
  }

  function detailHtml(m) {
    var form = m.form || {};
    var paras = ((m.reason && m.reason.paragraphs) || []).map(function (p) {
      return "<p>" + esc(p) + "</p>";
    }).join("");
    return (
      '<div class="formline">킥오프 전 폼 홈 ' + esc(form.home || "-") +
      " (" + esc(form.home_record || "-") + ", 승점 " + esc(form.home_pts) +
      ") · 원정 " + esc(form.away || "-") + " (" + esc(form.away_record || "-") +
      ", 승점 " + esc(form.away_pts) + ")" +
      (m.xg && m.xg.home != null ? " · 기대득점 " + m.xg.home + "-" + m.xg.away : "") +
      "</div>" +
      '<div class="why">' + paras + "</div>"
    );
  }

  function rowHtml(m) {
    var open = !!state.opened[m.id];
    var showMk = m.finished || open;
    var score = m.finished && m.score ? m.score[0] + ":" + m.score[1] : "—";
    var scoreCap = m.finished ? "결과" : (m.time || "예정");
    var btn = m.finished
      ? '<button type="button" class="btn ghost" data-toggle="' + esc(m.id) + '">' +
        (open ? "접기" : "근거") + "</button>"
      : (open
        ? '<button type="button" class="btn ghost" data-toggle="' + esc(m.id) + '">접기</button>'
        : '<button type="button" class="btn" data-open="' + esc(m.id) + '">분석하기</button>');
    return (
      '<article class="row ' + (m.league === "K2" ? "k2" : "k1") + (open ? " open" : "") + '">' +
        '<div class="head">' +
          '<div class="meta"><span class="lg">' + esc(m.league) + " " + esc(m.round) + "R</span><br>" +
            esc(md(m.date)) + (m.time ? " " + esc(m.time) : "") +
            (m.venue ? "<br>" + esc(m.venue) : "") + "</div>" +
          '<div class="teams">' + esc(m.home) + " vs " + esc(m.away) + "</div>" +
          '<div class="scorebox"><span>' + esc(scoreCap) + "</span><b>" + esc(score) + "</b></div>" +
          btn +
        "</div>" +
        (showMk ? marketsHtml(m) : "") +
        (open ? '<div class="detail">' + detailHtml(m) + "</div>" : "") +
      "</article>"
    );
  }

  function render() {
    fillRounds();
    renderStats();
    var rows = visible();
    document.getElementById("analyzeAll").style.display = state.tab === "up" ? "" : "none";
    if (!rows.length) {
      document.getElementById("list").innerHTML = '<p class="empty">해당 조건의 경기가 없습니다.</p>';
      return;
    }
    document.getElementById("list").innerHTML = rows.map(rowHtml).join("");
  }

  document.querySelector(".bar").addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.getAttribute("data-tab")) {
      state.tab = t.getAttribute("data-tab");
      state.round = state.tab === "done"
        ? lastFinishedRound(state.league)
        : String(currentRound(state.league));
      document.querySelectorAll("[data-tab]").forEach(function (b) {
        b.classList.toggle("on", b === t);
      });
      render();
    }
    if (t.getAttribute("data-lg")) {
      state.league = t.getAttribute("data-lg");
      state.round = pickDefaultRound(state.league);
      document.querySelectorAll("[data-lg]").forEach(function (b) {
        b.classList.toggle("on", b === t);
      });
      syncTabToRound();
      render();
    }
    if (t.id === "analyzeAll") {
      visible().forEach(function (m) { state.opened[m.id] = true; });
      saveOpened();
      render();
    }
  });
  document.getElementById("rounds").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-round]");
    if (!btn) return;
    state.round = btn.getAttribute("data-round");
    syncTabToRound();
    render();
  });
  document.getElementById("list").addEventListener("click", function (ev) {
    var open = ev.target.getAttribute("data-open");
    var tog = ev.target.getAttribute("data-toggle");
    var id = open || tog;
    if (!id) return;
    if (open) state.opened[id] = true;
    else state.opened[id] = !state.opened[id];
    if (!state.opened[id]) delete state.opened[id];
    saveOpened();
    render();
  });

  fetch("data/league.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("league.json " + r.status);
      return r.json();
    })
    .then(function (data) {
      state.data = data;
      state.round = pickDefaultRound(state.league);
      syncTabToRound();
      render();
    })
    .catch(function (err) {
      document.getElementById("list").innerHTML =
        '<p class="empty">data/league.json 을 불러오지 못했습니다. (' + esc(err.message) + ")</p>";
    });
})();
</script>
</body>
</html>
