<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K리그 라운드 분석</title>
<style>
:root {
  --bg:#090d12; --card:#141b24; --soft:#1b2430; --line:#2a3544;
  --text:#eef3f8; --muted:#8ea0b3; --k1:#5eb0ff; --k2:#3dce8e;
  --hit:#3dce8e; --miss:#ff6b7a; --warn:#f0c14b; --btn:#2d6cdf;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; line-height:1.45; }
.wrap { max-width:1080px; margin:0 auto; padding:18px 14px 64px; }
header.top { display:flex; justify-content:space-between; gap:12px; align-items:flex-end; margin-bottom:14px; }
h1 { margin:0; font-size:1.28rem; letter-spacing:-.03em; }
.sub { margin:4px 0 0; color:var(--muted); font-size:.82rem; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.stat b { display:block; color:var(--muted); font-size:.7rem; font-weight:600; }
.stat strong { font-size:1.15rem; }
.bar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; align-items:center; }
.bar button, .bar select {
  background:var(--soft); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:6px 10px; font-size:.8rem; cursor:pointer;
}
.bar button.on { border-color:var(--k1); color:#fff; background:#1c3148; }
.bar button.k2.on { border-color:var(--k2); background:#163528; }
.bar select { min-width:120px; }
.list { display:grid; gap:7px; }
.row {
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
}
.row.k1 { border-left:3px solid var(--k1); }
.row.k2 { border-left:3px solid var(--k2); }
.head { display:grid; grid-template-columns:86px 1fr auto; gap:8px; align-items:center; }
.meta { color:var(--muted); font-size:.72rem; }
.teams { font-weight:750; font-size:.98rem; }
.score { font-variant-numeric:tabular-nums; font-weight:800; color:#fff; min-width:52px; text-align:right; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
.chip {
  display:inline-flex; align-items:center; gap:4px;
  background:var(--soft); border:1px solid var(--line); border-radius:6px;
  padding:3px 6px; font-size:.7rem; color:var(--muted);
}
.chip b { color:var(--text); font-size:.78rem; }
.chip.ok { border-color:#245c44; background:#13261d; }
.chip.bad { border-color:#5c2a32; background:#2a1518; }
.chip.ok b { color:var(--hit); }
.chip.bad b { color:var(--miss); }
.actions { display:flex; gap:6px; }
.btn {
  background:var(--btn); color:#fff; border:0; border-radius:8px;
  padding:6px 10px; font-size:.78rem; font-weight:700; cursor:pointer;
}
.btn.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
.detail { display:none; margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
.row.open .detail { display:block; }
.grid7 { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.mk { background:#0f151c; border:1px solid var(--line); border-radius:8px; padding:7px 8px; }
.mk small { display:block; color:var(--muted); font-size:.66rem; }
.mk em { font-style:normal; font-weight:800; font-size:1rem; }
.mk .p { color:var(--muted); font-size:.68rem; margin-top:2px; }
.why { margin:10px 0 0; display:grid; gap:7px; }
.why p { margin:0; color:#c9d5e2; font-size:.82rem; }
.formline { color:var(--muted); font-size:.75rem; margin-top:4px; }
.empty { color:var(--muted); padding:28px 4px; }
footer { margin-top:22px; color:var(--muted); font-size:.74rem; }
@media (max-width:820px) {
  .stats { grid-template-columns:1fr 1fr; }
  .grid7 { grid-template-columns:1fr 1fr; }
  .head { grid-template-columns:1fr auto; }
  .meta { grid-column:1 / -1; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>K리그 라운드 분석</h1>
      <p class="sub" id="sub">일정·결과는 K리그 데이터. 프로토 회차와 무관합니다.</p>
    </div>
  </header>
  <section class="stats" id="stats"></section>
  <nav class="bar">
    <button type="button" class="on" data-tab="up">예정 경기</button>
    <button type="button" data-tab="done">지난 경기</button>
    <button type="button" class="on" data-lg="K1">K리그1</button>
    <button type="button" class="k2" data-lg="K2">K리그2</button>
    <select id="round"></select>
    <button type="button" class="ghost" id="analyzeAll">이 라운드 전부 분석</button>
  </nav>
  <section class="list" id="list"><p class="empty">불러오는 중…</p></section>
  <footer>
    모델: 킥오프 이전 공격/수비·최근 폼·홈 이점 포아송. 핸디캡은 홈팀 기준.
    예정 경기는 버튼을 눌러야 픽이 열립니다. 참고용이며 배당·라인 존재 여부는 별도 확인하세요.
  </footer>
</main>
<script>
(function () {
  "use strict";

  var MK = [
    ["wdl", "승무패"],
    ["h_p1", "H+1"],
    ["h_p2", "H+2"],
    ["h_m1", "H-1"],
    ["h_m2", "H-2"],
    ["ou25", "U2.5"],
    ["ou35", "U3.5"]
  ];
  var STORE = "kleague_view_open_v1";
  var state = { data: null, tab: "up", league: "K1", round: "cur", opened: loadOpened() };

  function loadOpened() {
    try { return JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function saveOpened() {
    try { localStorage.setItem(STORE, JSON.stringify(state.opened)); }
    catch (e) {}
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function pct(v) { return (Number(v || 0) * 100).toFixed(0) + "%"; }
  function md(d) {
    if (!d) return "";
    var p = String(d).split("-");
    return p.length === 3 ? p[1] + "." + p[2] : d;
  }

  function currentRound(lg) {
    return (state.data && state.data.current_round && state.data.current_round[lg]) || 1;
  }

  function visible() {
    var lg = state.league;
    var wantDone = state.tab === "done";
    return (state.data.matches || []).filter(function (m) {
      if (m.league !== lg) return false;
      if (!!m.finished !== wantDone) return false;
      if (state.round === "all") return true;
      if (state.round === "cur") return Number(m.round) === currentRound(lg);
      return String(m.round) === String(state.round);
    });
  }

  function fillRounds() {
    var lg = state.league;
    var set = {};
    (state.data.matches || []).forEach(function (m) {
      if (m.league === lg) set[m.round] = 1;
    });
    var rounds = Object.keys(set).sort(function (a, b) { return Number(a) - Number(b); });
    var cur = currentRound(lg);
    var html = '<option value="cur">현재 ' + cur + "R</option><option value=\"all\">전체 라운드</option>";
    rounds.forEach(function (r) {
      html += '<option value="' + r + '">' + r + "R</option>";
    });
    var el = document.getElementById("round");
    el.innerHTML = html;
    if ([].some.call(el.options, function (o) { return o.value === String(state.round); })) {
      el.value = String(state.round);
    } else {
      state.round = "cur";
      el.value = "cur";
    }
  }

  function renderStats() {
    var s = (state.data.summary || {})[state.league] || {};
    var hits = s.hits || {};
    function box(label, key) {
      var h = hits[key] || {};
      return '<div class="stat"><b>' + label + "</b><strong>" +
        (h.rate != null ? h.rate : "-") + "%</strong></div>";
    }
    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + (state.league === "K1" ? "K리그1" : "K리그2") +
      " 현재</b><strong>" + currentRound(state.league) + "R</strong></div>" +
      box("승무패 적중", "wdl") +
      box("H+1 적중", "h_p1") +
      box("U/O 2.5 적중", "ou25");
    document.getElementById("sub").textContent =
      "2026시즌 · 생성 " + (state.data.generated_at || "-") +
      " · 지난 경기는 예측과 실제를 같이 표시, 예정 경기는 분석하기를 누를 때 공개";
  }

  function chip(m, key, label) {
    var pick = m.picks && m.picks[key] ? m.picks[key].pick : "—";
    if (!m.finished) return '<span class="chip"><span>' + label + "</span><b>" + esc(pick) + "</b></span>";
    var ok = m.hit && m.hit[key];
    var act = m.actual && m.actual[key] ? m.actual[key] : "—";
    return '<span class="chip ' + (ok ? "ok" : "bad") + '"><span>' + label +
      "</span><b>" + esc(pick) + "</b><span>실 " + esc(act) + "</span></span>";
  }

  function mkBox(m, key, label) {
    var p = (m.picks && m.picks[key]) || {};
    var dist = p.dist || {};
    var extra = key.indexOf("ou") === 0
      ? "언더 " + pct(dist["언더"]) + " · 오버 " + pct(dist["오버"])
      : "승 " + pct(dist["승"]) + " 무 " + pct(dist["무"]) + " 패 " + pct(dist["패"]);
    var act = "";
    if (m.finished && m.actual) {
      act = '<div class="p">실제 ' + esc(m.actual[key] || "—") +
        (m.hit && m.hit[key] ? " · 적중" : " · 미적중") + "</div>";
    }
    return '<div class="mk"><small>' + label + "</small><em>" + esc(p.pick || "—") +
      "</em><div class=\"p\">" + extra + "</div>" + act + "</div>";
  }

  function detailHtml(m) {
    var form = m.form || {};
    var paras = ((m.reason && m.reason.paragraphs) || []).map(function (p) {
      return "<p>" + esc(p) + "</p>";
    }).join("");
    return (
      '<div class="formline">킥오프 전 폼 홈 ' + esc(form.home || "-") +
      " (" + esc(form.home_record || "-") + ", 승점 " + esc(form.home_pts) +
      ") · 원정 " + esc(form.away || "-") + " (" + esc(form.away_record || "-") +
      ", 승점 " + esc(form.away_pts) + ")" +
      (m.xg && m.xg.home != null ? " · 기대득점 " + m.xg.home + "-" + m.xg.away : "") +
      "</div>" +
      '<div class="grid7">' + MK.map(function (x) { return mkBox(m, x[0], x[1]); }).join("") + "</div>" +
      '<div class="why">' + paras + "</div>"
    );
  }

  function rowHtml(m) {
    var open = !!state.opened[m.id];
    var score = m.finished && m.score
      ? m.score[0] + " - " + m.score[1]
      : (m.time || "");
    var chips = "";
    if (m.finished || open) {
      chips = '<div class="chips">' + MK.map(function (x) { return chip(m, x[0], x[1]); }).join("") + "</div>";
    }
    var btn = m.finished
      ? '<button type="button" class="btn ghost" data-toggle="' + esc(m.id) + '">' +
        (open ? "접기" : "근거") + "</button>"
      : (open
        ? '<button type="button" class="btn ghost" data-toggle="' + esc(m.id) + '">접기</button>'
        : '<button type="button" class="btn" data-open="' + esc(m.id) + '">분석하기</button>');
    return (
      '<article class="row ' + (m.league === "K2" ? "k2" : "k1") + (open ? " open" : "") + '">' +
        '<div class="head">' +
          '<div class="meta">' + esc(m.league) + " " + esc(m.round) + "R · " + esc(md(m.date)) +
            (m.venue ? " · " + esc(m.venue) : "") + "</div>" +
          '<div class="teams">' + esc(m.home) + " vs " + esc(m.away) + "</div>" +
          '<div class="actions"><span class="score">' + esc(score) + "</span>" + btn + "</div>" +
        "</div>" +
        chips +
        (open ? '<div class="detail">' + detailHtml(m) + "</div>" : "") +
      "</article>"
    );
  }

  function render() {
    fillRounds();
    renderStats();
    var rows = visible();
    document.getElementById("analyzeAll").style.display = state.tab === "up" ? "" : "none";
    if (!rows.length) {
      document.getElementById("list").innerHTML = '<p class="empty">해당 조건의 경기가 없습니다.</p>';
      return;
    }
    document.getElementById("list").innerHTML = rows.map(rowHtml).join("");
  }

  document.querySelector(".bar").addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.getAttribute("data-tab")) {
      state.tab = t.getAttribute("data-tab");
      document.querySelectorAll("[data-tab]").forEach(function (b) {
        b.classList.toggle("on", b === t);
      });
      render();
    }
    if (t.getAttribute("data-lg")) {
      state.league = t.getAttribute("data-lg");
      state.round = "cur";
      document.querySelectorAll("[data-lg]").forEach(function (b) {
        b.classList.toggle("on", b === t);
      });
      render();
    }
    if (t.id === "analyzeAll") {
      visible().forEach(function (m) { state.opened[m.id] = true; });
      saveOpened();
      render();
    }
  });
  document.getElementById("round").addEventListener("change", function () {
    state.round = this.value;
    render();
  });
  document.getElementById("list").addEventListener("click", function (ev) {
    var open = ev.target.getAttribute("data-open");
    var tog = ev.target.getAttribute("data-toggle");
    var id = open || tog;
    if (!id) return;
    if (open) state.opened[id] = true;
    else state.opened[id] = !state.opened[id];
    if (!state.opened[id]) delete state.opened[id];
    saveOpened();
    render();
  });

  fetch("data/league.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("league.json " + r.status);
      return r.json();
    })
    .then(function (data) {
      state.data = data;
      render();
    })
    .catch(function (err) {
      document.getElementById("list").innerHTML =
        '<p class="empty">data/league.json 을 불러오지 못했습니다. (' + esc(err.message) + ")</p>";
    });
})();
</script>
</body>
</html>
