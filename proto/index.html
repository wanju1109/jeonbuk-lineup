<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>K리그 Proto · 블라인드 예측 → 결과 반영 → 학습</title>
<style>
:root{
  --bg:#0c1218; --panel:#15202b; --line:#2a3a4a; --text:#e7eef6; --muted:#93a7bb;
  --accent:#3dd6c6; --warn:#f0b429; --ok:#3dd68c; --bad:#ff6b6b; --btn:#1e6fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR",sans-serif;background:linear-gradient(180deg,#0a0f14,#15202b 45%,#0c1218);color:var(--text);line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 90px}
h1{font-size:1.45rem;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.toolbar,.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip,button.chip{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:8px 12px;font-size:.85rem;cursor:pointer
}
button.chip.active{border-color:var(--accent);color:var(--accent)}
button.action{
  background:var(--btn);border:0;color:#fff;border-radius:10px;padding:10px 14px;
  font-weight:700;cursor:pointer
}
button.action.secondary{background:#243447}
button.action.danger{background:#8b2e2e}
button:disabled{opacity:.45;cursor:not-allowed}
.statbox{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:140px
}
.statbox b{display:block;color:var(--muted);font-size:.78rem}
.statbox strong{font-size:1.25rem;color:var(--accent)}
.note{background:#182430;border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0 18px;color:var(--muted);font-size:.9rem}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start
}
.card.revealed{border-color:#355064}
.card.hit{box-shadow:inset 3px 0 0 var(--ok)}
.card.miss{box-shadow:inset 3px 0 0 var(--bad)}
.meta{color:var(--muted);font-size:.82rem}
h3{margin:4px 0 8px;font-size:1.05rem}
.vs{color:var(--muted);font-weight:500}
.picks{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:8px;margin:10px 0}
.picks div{background:#101820;border:1px solid var(--line);border-radius:10px;padding:8px}
.picks b{display:block;color:var(--muted);font-size:.72rem}
.picks strong{font-size:1.15rem;color:var(--warn)}
.reason{color:#c9d7e6;font-size:.88rem;margin-top:8px}
.side{display:flex;flex-direction:column;gap:8px;min-width:150px}
.score{
  font-size:1.4rem;font-weight:800;text-align:center;padding:10px;border-radius:12px;
  background:#101820;border:1px dashed var(--line);color:var(--muted)
}
.score.show{border-style:solid;color:var(--text);border-color:var(--accent)}
.compare{font-size:.82rem;color:var(--muted)}
.compare .ok{color:var(--ok);font-weight:700}
.compare .bad{color:var(--bad);font-weight:700}
.learnbox{margin-top:8px;padding:8px;border-radius:10px;background:#101820;font-size:.82rem;color:var(--muted);display:none}
.card.revealed .learnbox{display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
@media(max-width:800px){
  .card{grid-template-columns:1fr}
  .side{min-width:0}
  .picks{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>K리그 Proto · 블라인드 예측 학습장</h1>
  <p class="sub">왼쪽/본문에는 <b>예측만</b> 보입니다. 우측 <b>실제결과 반영</b>을 눌러야 스코어가 공개되고, 틀리면 가중치를 학습합니다.</p>
  <div class="note" id="methodNote"></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button class="chip active" data-filter="all">전체</button>
    <button class="chip" data-filter="blind">미공개만</button>
    <button class="chip" data-filter="revealed">공개됨</button>
    <button class="chip" data-filter="upcoming">예정(미실시)</button>
    <button class="chip" data-filter="K1">K리그1</button>
    <button class="chip" data-filter="K2">K리그2</button>
  </div>
  <div class="toolbar">
    <label class="chip">라운드
      <select id="roundSelect" style="margin-left:6px;background:transparent;border:0;color:inherit"></select>
    </label>
    <button class="action secondary" id="btnRevealRound">이 라운드 일괄 반영</button>
    <button class="action secondary" id="btnHideAll">다시 가리기</button>
    <button class="action" id="btnExportLearn">학습 내보내기</button>
    <button class="action secondary" id="btnImportLearn">학습 가져오기</button>
    <button class="action danger" id="btnResetLearn">학습 초기화</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden/>
  </div>

  <div id="list"></div>
</div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
