<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeonbuk Header Goal Animation Builder</title>
    <!-- HTML to Image Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- GIF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 { color: #00e676; margin-bottom: 20px; }

        /* 밝고 화사한 초록빛 경기장 배경으로 상향 조정 */
        #pitch-wrapper {
            background-color: #388e3c;
            border: 4px solid #ffffff;
            border-radius: 12px;
            position: relative;
            width: 440px;
            height: 620px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        #pitch { width: 100%; height: 100%; position: relative; }

        .pitch-line { position: absolute; border: 2px solid rgba(255, 255, 255, 0.7); pointer-events: none; z-index: 1; }
        .center-line { top: 50%; left: 0; width: 100%; height: 0; }
        .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box.top { top: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-top: none; }
        .penalty-box.bottom { bottom: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-bottom: none; }

        .player-card {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 65px;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: transform 0.1s ease;
        }
        
        .player-img {
            width: 45px; height: 45px; border-radius: 50%; object-fit: cover;
            border: 2px solid #00e676; background-color: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .player-info {
            background-color: rgba(20,20,20,0.9); color: #fff; font-size: 10px;
            padding: 3px 5px; border-radius: 4px; margin-top: 3px; font-weight: bold;
            border: 1px solid #444; text-align: center; white-space: nowrap; max-width: 62px; overflow: hidden; text-overflow: ellipsis;
        }

        /* 선명하게 출력되는 고화질 축구공 이미지 */
        #ball {
            position: absolute;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            z-index: 15;
            display: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            object-fit: contain;
            border-radius: 50%;
            background-color: #fff;
        }

        .btn-gif-download { 
            background: linear-gradient(135deg, #00c853, #64dd17); 
            color: #111; width: 440px; font-size: 16px; padding: 15px; 
            font-weight: bold; border-radius: 8px; border: none;
            box-shadow: 0 4px 10px rgba(0,200,83,0.3); cursor: pointer; 
        }
        .btn-gif-download:hover { opacity: 0.9; }
        .btn-gif-download:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }

        #status-msg {
            margin-top: 15px;
            color: #00e676;
            font-weight: bold;
            font-size: 14px;
        }

        #debug-log {
            width: 440px;
            height: 100px;
            background: #000;
            color: #00e676;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #333;
            border-radius: 6px;
            overflow-y: auto;
            margin-top: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>🟢 전북 현대 헤더 골 애니메이션</h1>
    
    <div id="pitch-wrapper">
        <div id="pitch">
            <div class="pitch-line center-line"></div>
            <div class="pitch-line center-circle"></div>
            <div class="pitch-line penalty-box top"></div>
            <div class="pitch-line penalty-box bottom"></div>
            
            <!-- 선명한 클래식 축구공 (프록시 경유) -->
            <img id="ball" crossorigin="anonymous" src="https://images.weserv.nl/?url=cdn-icons-png.flaticon.com/512/53/53283.png" alt="축구공">
        </div>
    </div>

    <button id="btn-download" class="btn-gif-download" onclick="generateCrossGif()">🎬 고품질 GIF 다운받기</button>
    <div id="status-msg">대기 중...</div>
    <div id="debug-log"></div>

    <script>
        function logDebug(msg) {
            console.log(msg);
            const logBox = document.getElementById('debug-log');
            if (logBox) {
                logBox.innerHTML += `> ${msg}<br>`;
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        const IMG_BASE_URL = "https://images.weserv.nl/?url=jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/";

        const strikers = [
            { id: "s1", backNo: "81", name: "기티스", img: "20260224.png", baseX: 28, baseY: 22, phase: 0.0 },
            { id: "s2", backNo: "96", name: "콤파뇨", img: "20250061.png", baseX: 42, baseY: 20, phase: 1.5 },
            { id: "s3", backNo: "99", name: "모따", img: "20230224.png", baseX: 58, baseY: 20, phase: 3.0 },
            { id: "s4", backNo: "9",  name: "티아고", img: "20220244.png", baseX: 72, baseY: 22, phase: 4.5 }
        ];

        const crossers = [
            { id: "c1", backNo: "77", name: "김태현", img: "20180185.png", startX: 8, startY: 75, crossX: 12, crossY: 35, ctrlX: 30, ctrlY: 0 },
            { id: "c2", backNo: "23", name: "김태환", img: "20100052.png", startX: 92, startY: 75, crossX: 88, crossY: 35, ctrlX: 70, ctrlY: 0 },
            { id: "c3", backNo: "10", name: "이승우", img: "20220042.png", startX: 20, startY: 65, crossX: 25, crossY: 28, ctrlX: 35, ctrlY: -5 },
            { id: "c4", backNo: "7",  name: "이동준", img: "20170121.png", startX: 80, startY: 65, crossX: 75, crossY: 28, ctrlX: 65, ctrlY: -5 }
        ];

        const targetX = 50, targetY = 16;
        const goalX = 50, goalY = 2;

        function initPitch() {
            logDebug("초기화 시작...");
            const pitch = document.getElementById('pitch');
            const allPlayers = [...strikers, ...crossers];

            allPlayers.forEach(p => {
                const card = document.createElement('div');
                card.id = p.id;
                card.className = 'player-card';
                card.style.left = `${p.baseX || p.startX}%`;
                card.style.top = `${p.baseY || p.startY}%`;

                const img = document.createElement('img');
                img.crossOrigin = "anonymous";
                img.src = IMG_BASE_URL + p.img;
                img.className = 'player-img';

                const info = document.createElement('div');
                info.className = 'player-info';
                info.innerText = `${p.backNo}. ${p.name}`;

                card.appendChild(img);
                card.appendChild(info);
                pitch.appendChild(card);
            });
            logDebug("초기화 완료!");
        }

        function getBezier(t, p0, p1, p2) {
            return Math.pow(1 - t, 2) * p0 + 2 * (1 - t) * t * p1 + Math.pow(t, 2) * p2;
        }

        function updateAnimation(progress) {
            const ball = document.getElementById('ball');
            const phaseIndex = Math.min(3, Math.floor(progress * 4));
            const phaseProgress = (progress * 4) % 1.0; 

            strikers.forEach((s, idx) => {
                const el = document.getElementById(s.id);
                if (!el) return;
                if (idx === phaseIndex) {
                    if (phaseProgress < 0.45) {
                        const offsetX = Math.sin(progress * Math.PI * 12 + s.phase) * 1.5;
                        const offsetY = Math.cos(progress * Math.PI * 15 + s.phase) * 1.5;
                        el.style.left = `${s.baseX + offsetX}%`;
                        el.style.top = `${s.baseY + offsetY}%`;
                        el.style.transform = `translate(-50%, -50%) scale(1)`;
                        el.style.zIndex = 10;
                    } else if (phaseProgress < 0.55) {
                        const t = (phaseProgress - 0.45) / 0.10;
                        el.style.left = `${s.baseX + (targetX - s.baseX) * t}%`;
                        el.style.top = `${s.baseY + (targetY - s.baseY) * t}%`;
                        el.style.transform = `translate(-50%, -50%) scale(${1 + t * 0.3})`;
                        el.style.zIndex = 20;
                    } else if (phaseProgress < 0.70) {
                        el.style.left = `${targetX}%`;
                        el.style.top = `${targetY}%`;
                        el.style.transform = `translate(-50%, -50%) scale(1.3)`;
                    } else {
                        const t = (phaseProgress - 0.70) / 0.30;
                        el.style.left = `${targetX + (s.baseX - targetX) * t}%`;
                        el.style.top = `${targetY + (s.baseY - targetY) * t}%`;
                        el.style.transform = `translate(-50%, -50%) scale(${1.3 - (t * 0.3)})`;
                        el.style.zIndex = 10;
                    }
                } else {
                    const offsetX = Math.sin(progress * Math.PI * 12 + s.phase) * 1.5;
                    const offsetY = Math.cos(progress * Math.PI * 15 + s.phase) * 1.5;
                    el.style.left = `${s.baseX + offsetX}%`;
                    el.style.top = `${s.baseY + offsetY}%`;
                    el.style.transform = `translate(-50%, -50%) scale(1)`;
                    el.style.zIndex = 10;
                }
            });

            crossers.forEach((c, idx) => {
                const el = document.getElementById(c.id);
                if (!el) return;
                if (idx === phaseIndex) {
                    if (phaseProgress < 0.20) {
                        const t = phaseProgress / 0.20; 
                        const easeOut = 1 - Math.pow(1 - t, 2);
                        const curX = c.startX + (c.crossX - c.startX) * easeOut;
                        const curY = c.startY + (c.crossY - c.startY) * easeOut;
                        el.style.left = `${curX}%`;
                        el.style.top = `${curY}%`;
                        ball.style.display = 'block';
                        ball.style.left = `${curX}%`;
                        ball.style.top = `${curY - 3}%`;
                    } else if (phaseProgress < 0.55) {
                        const t = (phaseProgress - 0.20) / 0.35; 
                        el.style.left = `${c.crossX}%`;
                        el.style.top = `${c.crossY}%`;
                        ball.style.display = 'block';
                        ball.style.left = `${getBezier(t, c.crossX, c.ctrlX, targetX)}%`;
                        ball.style.top = `${getBezier(t, c.crossY, c.ctrlY, targetY)}%`;
                    } else if (phaseProgress < 0.70) {
                        const t = (phaseProgress - 0.55) / 0.15; 
                        el.style.left = `${c.crossX}%`;
                        el.style.top = `${c.crossY}%`;
                        ball.style.display = 'block';
                        ball.style.left = `${targetX + (goalX - targetX) * t}%`;
                        ball.style.top = `${targetY + (goalY - targetY) * t}%`;
                    } else {
                        el.style.left = `${c.crossX + (c.startX - c.crossX) * ((phaseProgress - 0.70) / 0.30)}%`;
                        el.style.top = `${c.crossY + (c.startY - c.crossY) * ((phaseProgress - 0.70) / 0.30)}%`;
                        ball.style.display = 'none';
                    }
                } else {
                    el.style.left = `${c.startX}%`;
                    el.style.top = `${c.startY}%`;
                }
            });
        }

        let isGenerating = false;
        let previewProgress = 0;

        function animatePreview() {
            if (!isGenerating) {
                previewProgress += 0.001; // 두 배 늘어난 프레임에 맞춰 속도 조정
                if (previewProgress >= 1) previewProgress = 0;
                updateAnimation(previewProgress);
            }
            requestAnimationFrame(animatePreview);
        }

        async function generateCrossGif() {
            const btn = document.getElementById('btn-download');
            const status = document.getElementById('status-msg');
            const wrapper = document.getElementById('pitch-wrapper');
            
            isGenerating = true;
            btn.disabled = true;
            logDebug("GIF 생성 프로세스 시작...");
            
            try {
                // 프레임 수를 40장에서 두 배인 80장으로 설정하여 부드러움 극대화
                const totalFrames = 80;
                logDebug(`총 ${totalFrames}개 프레임 캡처 설정 완료`);

                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    repeat: 0,
                    width: wrapper.offsetWidth,
                    height: wrapper.offsetHeight
                });

                try {
                    const workerCode = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r => r.text());
                    const blob = new Blob([workerCode], { type: 'application/javascript' });
                    gif.options.workerScript = URL.createObjectURL(blob);
                    logDebug("인라인 워커 스크립트 생성 성공");
                } catch(e) {
                    logDebug("인라인 워커 로드 우회 시도");
                }

                gif.on('error', function(err) {
                    logDebug(`GIF.js 내부 에러 발생: ${err}`);
                });

                for(let i = 0; i < totalFrames; i++) {
                    const progress = i / totalFrames;
                    updateAnimation(progress);
                    
                    const canvas = await html2canvas(wrapper, { 
                        scale: 1, 
                        useCORS: true, 
                        backgroundColor: "#388e3c" 
                    });
                    
                    gif.addFrame(canvas, { copy: true, delay: 50 }); // 딜레이를 줄여 부드러운 재생 유지
                    status.innerText = `프레임 캡처 중... (${i + 1}/${totalFrames})`;
                    
                    if (i % 20 === 0) logDebug(`프레임 캡처 진행 중: ${i}/${totalFrames}`);
                    await new Promise(r => setTimeout(r, 5));
                }

                updateAnimation(0);
                logDebug("모든 프레임 캡처 완료. gif.render() 호출 전...");
                status.innerText = "GIF 파일 컴파일 중...";

                gif.on('finished', function(blob) {
                    logDebug("GIF 컴파일 완료! 다운로드 링크 생성 중...");
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'jeonbuk_header_goal.gif';
                    link.click();
                    
                    btn.disabled = false;
                    btn.innerText = "🎬 고품질 GIF 다운받기";
                    status.innerText = "✅ 다운로드 완료!";
                    isGenerating = false;
                });

                gif.render();

            } catch (err) {
                logDebug(`[CRITICAL ERROR] catch문 진입: ${err.message}`);
                console.error("GIF Render Error:", err);
                status.innerText = "❌ GIF 생성 중 오류 발생";
                btn.disabled = false;
                btn.innerText = "🎬 고품질 GIF 다운받기";
                isGenerating = false;
            }
        }

        window.onload = () => {
            initPitch();
            animatePreview();
        };
    </script>
</body>
</html>
