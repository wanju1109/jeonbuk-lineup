    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            color: #00e676;
            font-weight: 900;
            letter-spacing: -1px;
            text-align: center;
        }

        .top-bar {
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #333;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-bar label {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
        }

        .top-bar select {
            background-color: #2a2a2a;
            color: #fff;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #444;
            outline: none;
            cursor: pointer;
        }

        .top-bar button {
            background: linear-gradient(135deg, #00c853, #64dd17);
            color: #111;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 900;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,200,83,0.3);
        }

        .container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #pitch-wrapper {
            background: linear-gradient(180deg, #1b5e20, #2e7d32, #1b5e20);
            border: 4px solid #ffffff;
            border-radius: 12px;
            position: relative;
            width: 440px;
            height: 620px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #pitch {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .pitch-line {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }
        .center-line { top: 50%; left: 0; width: 100%; height: 0; }
        .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box.top { top: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-top: none; }
        .penalty-box.bottom { bottom: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-bottom: none; }

        .position-slot {
            position: absolute;
            width: 52px;
            height: 62px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            background-color: rgba(0, 0, 0, 0.25);
            pointer-events: auto;
            cursor: pointer;
        }
        .position-slot.selected {
            border: 3px solid #ffeb3b;
            background-color: rgba(255, 235, 59, 0.3);
        }

        #bench {
            width: 300px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            height: 620px;
            box-sizing: border-box;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        #bench h3 {
            margin: 0 0 10px 0;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            font-size: 14px;
            color: #00e676;
        }

        .position-group {
            margin-bottom: 10px;
        }
        .position-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
            border-left: 3px solid #00e676;
            padding-left: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .sub-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            cursor: grab;
            z-index: 10;
        }
        .player-card.selected-card {
            outline: 3px solid #ffeb3b;
            border-radius: 8px;
            background-color: rgba(255, 235, 59, 0.2);
        }
        .player-card:active {
            cursor: grabbing;
        }

        .player-img, .player-info, .player-placeholder {
            pointer-events: none; 
        }

        .player-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00e676;
            background-color: #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .player-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #00e676;
            background-color: #004d40;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .player-info {
            background-color: rgba(20, 20, 20, 0.9);
            color: #ffffff;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 2px;
            white-space: nowrap;
            text-align: center;
            font-weight: bold;
            border: 1px solid #444;
        }

        .starter {
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

                { id: "ST2", label: "RS", x: 62, y: 20 }
            ],
            "4-1-3-2": [
                { id: "GK", label: "GK", x: 50, y: 90 },
                { id: "LB", label: "LB", x: 15, y: 75 },
                { id: "CB1", label: "CB", x: 38, y: 78 },
                { id: "CB2", label: "CB", x: 62, y: 78 },
                { id: "RB", label: "RB", x: 85, y: 75 },
                { id: "CDM", label: "CDM", x: 50, y: 65 },
                { id: "LM", label: "LM", x: 20, y: 45 },
                { id: "CM", label: "CM", x: 50, y: 48 },
                { id: "RM", label: "RM", x: 80, y: 45 },
                { id: "ST1", label: "LS", x: 38, y: 20 },
                { id: "ST2", label: "RS", x: 62, y: 20 }
            ],
            "3-2-4-1": [
                { id: "GK", label: "GK", x: 50, y: 90 },
                { id: "LCB", label: "LCB", x: 30, y: 80 },
                { id: "CB", label: "CB", x: 50, y: 82 },
                { id: "RCB", label: "RCB", x: 70, y: 80 },
                { id: "DM1", label: "LDM", x: 38, y: 65 },
                { id: "DM2", label: "RDM", x: 62, y: 65 },
                { id: "LW", label: "LW", x: 18, y: 42 },
                { id: "AM1", label: "LAM", x: 38, y: 40 },
                { id: "AM2", label: "RAM", x: 62, y: 40 },
                { id: "RW", label: "RW", x: 82, y: 42 },
                { id: "ST", label: "ST", x: 50, y: 20 }
            ]
        };

        let currentFormation = "4-3-3";
        let selectedPlayerId = null; // 터치/클릭 선택된 선수 ID

        function render() {
            const pitch = document.getElementById('pitch');
            document.querySelectorAll('.position-slot, #pitch .player-card').forEach(el => el.remove());
            ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
                document.getElementById(`sub-list-${pos}`).innerHTML = '';
            });

            // 포메이션 슬롯 생성
            const slots = formations[currentFormation];
            slots.forEach(slot => {
                const slotEl = document.createElement('div');
                slotEl.className = 'position-slot';
                if (selectedPlayerId && squad.find(p => p.id === selectedPlayerId)) {
                    slotEl.classList.add('selected'); // 선택된 선수가 있을 때 슬롯 강조
                }
                slotEl.dataset.slotId = slot.id;
                slotEl.style.left = slot.x + '%';
                slotEl.style.top = slot.y + '%';
                slotEl.innerText = slot.label;

                // 클릭(터치)으로 선수 배치
                slotEl.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedPlayerId !== null) {
                        // 이미 다른 슬롯에 있던 기존 선수는 벤치로
                        squad.forEach(p => {
                            if (p.slotId === slot.id) p.slotId = null;
                        });
                        // 선택된 선수를 이 슬롯에 배치
                        const player = squad.find(p => p.id === selectedPlayerId);
                        if (player) {
                            player.slotId = slot.id;
                        }
                        selectedPlayerId = null;
                        render();
                    }
                };

                // 드래그 앤 드롭 지원
                slotEl.ondragover = (e) => e.preventDefault();
                slotEl.ondrop = (e) => {
                    e.preventDefault();
                    const playerId = parseInt(e.dataTransfer.getData('playerId'));
                    squad.forEach(p => {
                        if (p.slotId === slot.id) p.slotId = null;
                    });
                    const player = squad.find(p => p.id === playerId);
                    if (player) {
                        player.slotId = slot.id;
                    }
                    render();
                };

                pitch.appendChild(slotEl);
            });

            // 선수 카드 생성 및 배치
            squad.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                if (player.id === selectedPlayerId) {
                    card.classList.add('selected-card');
                }
                card.draggable = true;

                // 클릭(터치) 선택 이벤트
                card.onclick = (e) => {
                    e.stopPropagation();
                    if (player.slotId) {
                        // 그라운드에 있는 선수를 누르면 벤치로 보냄
                        player.slotId = null;
                        selectedPlayerId = null;
                    } else {
                        // 벤치에 있는 선수를 누르면 선택 상태로 지정
                        if (selectedPlayerId === player.id) {
                            selectedPlayerId = null; // 다시 누르면 해제
                        } else {
                            selectedPlayerId = player.id;
                        }
                    }
                    render();
                };

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('playerId', player.id);
                };

                if (player.img) {
                    const img = document.createElement('img');
                    img.src = player.img;
                    img.className = 'player-img';
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'player-placeholder';
                    placeholder.innerText = player.name;
                    card.appendChild(placeholder);
                }

                const info = document.createElement('div');
                info.className = 'player-info';
                info.innerText = `${player.backNo}. ${player.name}`;
                card.appendChild(info);

                if (player.slotId) {
                    const targetSlot = document.querySelector(`.position-slot[data-slot-id="${player.slotId}"]`);
                    if (targetSlot) {
                        card.classList.add('starter');
                        card.style.left = targetSlot.style.left;
                        card.style.top = targetSlot.style.top;
                        pitch.appendChild(card);
                        targetSlot.style.color = 'transparent';
                    } else {
                        player.slotId = null;
                    }
                } else {
                    const targetList = document.getElementById(`sub-list-${player.pos}`);
                    if (targetList) {
                        targetList.appendChild(card);
                    }
                }
            });
        }

        function changeFormation() {
            const select = document.getElementById('formation-select');
            currentFormation = select.value;
            squad.forEach(p => p.slotId = null);
            selectedPlayerId = null;
            render();
        }

        // 벤치 빈 곳을 누르거나 드롭했을 때 처리
        function handleBenchClick(e) {
            if (selectedPlayerId !== null) {
                const player = squad.find(p => p.id === selectedPlayerId);
                if (player) {
                    player.slotId = null;
                }
                selectedPlayerId = null;
                render();
            }
        }

        const bench = document.getElementById('bench');
        bench.ondragover = (e) => e.preventDefault();
        bench.ondrop = (e) => {
            e.preventDefault();
            const playerId = parseInt(e.dataTransfer.getData('playerId'));
            const player = squad.find(p => p.id === playerId);
            if (!player) return;

            player.slotId = null;
            render();
        };

        function copyImageToClipboard() {
            const target = document.getElementById('pitch-wrapper');
            html2canvas(target, { backgroundColor: null, scale: 2 }).then(canvas => {
                canvas.toBlob(blob => {
                    try {
                        const item = new ClipboardItem({ "image/png": blob });
                        navigator.clipboard.write([item]).then(() => {
                            alert("✨ 베스트 11 이미지가 클립보드에 복사되었습니다! 카카오톡 대화창 등에 바로 붙여넣기(Ctrl+V) 하세요.");
                        }).catch(err => {
                            alert("이미지 복사에 실패했습니다. 브라우저 권한을 확인해주세요.");
                        });
                    } catch (e) {
                        alert("이 브라우저는 클립보드 직접 복사를 지원하지 않을 수 있습니다.");
                    }
                });
            });
        }

        render();
    </script>
</body>
</html>
