<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            color: #00e676;
            font-weight: 900;
            letter-spacing: -1px;
            text-align: center;
        }

        .top-bar {
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid #333;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-bar label {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
        }

        .top-bar select {
            background-color: #2a2a2a;
            color: #fff;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #444;
            outline: none;
            cursor: pointer;
        }

        .top-bar button {
            background: linear-gradient(135deg, #00c853, #64dd17);
            color: #111;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 900;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,200,83,0.3);
        }

        .container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #pitch-wrapper {
            background: linear-gradient(180deg, #1b5e20, #2e7d32, #1b5e20);
            border: 4px solid #ffffff;
            border-radius: 12px;
            position: relative;
            width: 440px;
            height: 620px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #pitch {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .pitch-line {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }
        .center-line { top: 50%; left: 0; width: 100%; height: 0; }
        .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box.top { top: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-top: none; }
        .penalty-box.bottom { bottom: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-bottom: none; }

        .position-slot {
            position: absolute;
            width: 52px;
            height: 62px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            background-color: rgba(0, 0, 0, 0.25);
            pointer-events: auto;
            cursor: pointer;
        }
        .position-slot.selected {
            border: 3px solid #ffeb3b;
            background-color: rgba(255, 235, 59, 0.3);
        }

        #bench {
            width: 340px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            height: 620px;
            box-sizing: border-box;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        #bench h3 {
            margin: 0 0 10px 0;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            font-size: 14px;
            color: #00e676;
        }

        .position-group {
            margin-bottom: 12px;
        }
        .position-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            border-left: 3px solid #00e676;
            padding-left: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .sub-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 65px;
            cursor: grab;
            z-index: 10;
        }
        .player-card.selected-card {
            outline: 3px solid #ffeb3b;
            border-radius: 8px;
            background-color: rgba(255, 235, 59, 0.2);
        }
        .player-card:active {
            cursor: grabbing;
        }

        .player-img, .player-info, .player-placeholder {
            pointer-events: none; 
        }

        .player-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00e676;
            background-color: #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .player-placeholder {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #00e676;
            background-color: #004d40;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .player-info {
            background-color: rgba(20, 20, 20, 0.9);
            color: #ffffff;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 2px;
            white-space: nowrap;
            text-align: center;
            font-weight: bold;
            border: 1px solid #444;
            max-width: 62px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .starter {
            position: absolute;
            transform: translate(-50%, -50%);
        }

        /* Modal Styles */
        #image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,230,118,0.2);
        }
        .modal-content img {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
            border: 2px solid #00e676;
            margin: 15px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: #111;
        }
        .btn-download { background-color: #00e676; }
        .btn-close { background-color: #555; color: #fff; }
    </style>
</head>

            "5-4-1": [{ id: "GK", label: "GK", x: 50, y: 90 }, { id: "LWB", label: "LWB", x: 12, y: 68 }, { id: "LCB", label: "LCB", x: 30, y: 78 }, { id: "CB", label: "CB", x: 50, y: 80 }, { id: "RCB", label: "RCB", x: 70, y: 78 }, { id: "RWB", label: "RWB", x: 88, y: 68 }, { id: "LM", label: "LM", x: 20, y: 45 }, { id: "CM1", label: "CM", x: 40, y: 48 }, { id: "CM2", label: "CM", x: 60, y: 48 }, { id: "RM", label: "RM", x: 80, y: 45 }, { id: "ST", label: "ST", x: 50, y: 20 }],
            "4-2-2-2": [{ id: "GK", label: "GK", x: 50, y: 90 }, { id: "LB", label: "LB", x: 15, y: 75 }, { id: "CB1", label: "CB", x: 38, y: 78 }, { id: "CB2", label: "CB", x: 62, y: 78 }, { id: "RB", label: "RB", x: 85, y: 75 }, { id: "LDM", label: "LDM", x: 38, y: 62 }, { id: "RDM", label: "RDM", x: 62, y: 62 }, { id: "LAM", label: "LAM", x: 32, y: 40 }, { id: "RAM", label: "RAM", x: 68, y: 40 }, { id: "ST1", label: "LS", x: 38, y: 20 }, { id: "ST2", label: "RS", x: 62, y: 20 }],
            "4-1-3-2": [{ id: "GK", label: "GK", x: 50, y: 90 }, { id: "LB", label: "LB", x: 15, y: 75 }, { id: "CB1", label: "CB", x: 38, y: 78 }, { id: "CB2", label: "CB", x: 62, y: 78 }, { id: "RB", label: "RB", x: 85, y: 75 }, { id: "CDM", label: "CDM", x: 50, y: 65 }, { id: "LM", label: "LM", x: 20, y: 45 }, { id: "CM", label: "CM", x: 50, y: 48 }, { id: "RM", label: "RM", x: 80, y: 45 }, { id: "ST1", label: "LS", x: 38, y: 20 }, { id: "ST2", label: "RS", x: 62, y: 20 }],
            "3-2-4-1": [{ id: "GK", label: "GK", x: 50, y: 90 }, { id: "LCB", label: "LCB", x: 30, y: 80 }, { id: "CB", label: "CB", x: 50, y: 82 }, { id: "RCB", label: "RCB", x: 70, y: 80 }, { id: "DM1", label: "LDM", x: 38, y: 65 }, { id: "DM2", label: "RDM", x: 62, y: 65 }, { id: "LW", label: "LW", x: 18, y: 42 }, { id: "AM1", label: "LAM", x: 38, y: 40 }, { id: "AM2", label: "RAM", x: 62, y: 40 }, { id: "RW", label: "RW", x: 82, y: 42 }, { id: "ST", label: "ST", x: 50, y: 20 }]
        };

        let currentFormation = "4-3-1-2";
        let selectedPlayerId = null;
        let capturedBlob = null; // 저장/공유용 Blob 객체 보관 변수

        function assignPlayerToSlot(playerId, slotId) {
            squad.forEach(p => {
                if (p.slotId === slotId) p.slotId = null;
            });
            squad.forEach(p => {
                if (p.id === playerId) p.slotId = slotId;
            });
            selectedPlayerId = null;
            render();
        }

        function render() {
            const pitch = document.getElementById('pitch');
            document.querySelectorAll('.position-slot, #pitch .player-card').forEach(el => el.remove());
            ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
                document.getElementById(`sub-list-${pos}`).innerHTML = '';
            });

            const slots = formations[currentFormation];
            slots.forEach(slot => {
                const slotEl = document.createElement('div');
                slotEl.className = 'position-slot';
                if (selectedPlayerId !== null) slotEl.classList.add('selected');
                slotEl.dataset.slotId = slot.id;
                slotEl.style.left = slot.x + '%';
                slotEl.style.top = slot.y + '%';
                slotEl.innerText = slot.label;

                slotEl.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedPlayerId !== null) assignPlayerToSlot(selectedPlayerId, slot.id);
                };

                slotEl.ondragover = (e) => e.preventDefault();
                slotEl.ondrop = (e) => {
                    e.preventDefault();
                    const playerId = parseInt(e.dataTransfer.getData('playerId'));
                    if (!isNaN(playerId)) assignPlayerToSlot(playerId, slot.id);
                };

                pitch.appendChild(slotEl);
            });

            const sortedSquad = [...squad].sort((a, b) => parseInt(a.backNo) - parseInt(b.backNo));

            sortedSquad.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                if (player.id === selectedPlayerId) card.classList.add('selected-card');
                card.draggable = true;

                card.onclick = (e) => {
                    e.stopPropagation();
                    if (player.slotId) {
                        if (selectedPlayerId !== null && selectedPlayerId !== player.id) {
                            assignPlayerToSlot(selectedPlayerId, player.slotId);
                        } else {
                            player.slotId = null;
                            selectedPlayerId = null;
                            render();
                        }
                    } else {
                        selectedPlayerId = (selectedPlayerId === player.id) ? null : player.id;
                        render();
                    }
                };

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('playerId', player.id);
                    selectedPlayerId = player.id;
                };

                card.ondragover = (e) => {
                    if (player.slotId) e.preventDefault();
                };
                card.ondrop = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (player.slotId) {
                        const incomingPlayerId = parseInt(e.dataTransfer.getData('playerId'));
                        if (!isNaN(incomingPlayerId) && incomingPlayerId !== player.id) {
                            assignPlayerToSlot(incomingPlayerId, player.slotId);
                        }
                    }
                };

                if (player.img) {
                    const img = document.createElement('img');
                    img.crossOrigin = "anonymous";
                    img.src = `https://images.weserv.nl/?url=${player.img.replace('https://', '')}`;
                    img.className = 'player-img';
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'player-placeholder';
                    placeholder.innerText = player.name;
                    card.appendChild(placeholder);
                }

                const info = document.createElement('div');
                info.className = 'player-info';
                info.innerText = `${player.backNo}. ${player.name}`;
                card.appendChild(info);

                if (player.slotId) {
                    const targetSlot = document.querySelector(`.position-slot[data-slot-id="${player.slotId}"]`);
                    if (targetSlot) {
                        card.classList.add('starter');
                        card.style.left = targetSlot.style.left;
                        card.style.top = targetSlot.style.top;
                        pitch.appendChild(card);
                        targetSlot.style.color = 'transparent';
                    } else {
                        player.slotId = null;
                    }
                } else {
                    const targetList = document.getElementById(`sub-list-${player.pos}`);
                    if (targetList) targetList.appendChild(card);
                }
            });
        }

        function changeFormation() {
            const select = document.getElementById('formation-select');
            currentFormation = select.value;
            squad.forEach(p => p.slotId = null);
            selectedPlayerId = null;
            render();
        }

        function handleBenchClick(e) {
            if (selectedPlayerId !== null) {
                const player = squad.find(p => p.id === selectedPlayerId);
                if (player) player.slotId = null;
                selectedPlayerId = null;
                render();
            }
        }

        const bench = document.getElementById('bench');
        bench.ondragover = (e) => e.preventDefault();
        bench.ondrop = (e) => {
            e.preventDefault();
            const playerId = parseInt(e.dataTransfer.getData('playerId'));
            const player = squad.find(p => p.id === playerId);
            if (player) {
                player.slotId = null;
                render();
            }
        };

        function openImageModal() {
            const btn = document.getElementById('capture-btn');
            const originalText = btn.innerText;
            btn.innerText = "⏳ 캡처 중...";

            const slots = document.querySelectorAll('.position-slot');
            slots.forEach(slot => slot.style.display = 'none');

            const target = document.getElementById('pitch-wrapper');
            html2canvas(target, { backgroundColor: null, scale: 1, useCORS: true, allowTaint: true }).then(canvas => {
                slots.forEach(slot => slot.style.display = 'flex');

                canvas.toBlob(blob => {
                    capturedBlob = blob; // 전역 변수에 저장
                    const url = URL.createObjectURL(blob);
                    
                    if (navigator.clipboard && window.ClipboardItem) {
                        try {
                            const item = new ClipboardItem({ "image/png": blob });
                            navigator.clipboard.write([item]).catch(e => console.log(e));
                        } catch (err) {}
                    }

                    document.getElementById('result-img').src = url;
                    document.getElementById('image-modal').style.display = 'flex';
                    
                    btn.innerText = originalText;
                }, 'image/png');
            }).catch(err => {
                slots.forEach(slot => slot.style.display = 'flex');
                btn.innerText = originalText;
            });
        }

        // 모바일 네이티브 공유 및 다운로드 처리 함수
        function saveOrShareImage() {
            if (!capturedBlob) return;
            const file = new File([capturedBlob], 'jeonbuk-squad.png', { type: 'image/png' });

            // 모바일 Web Share API 지원 확인 (스마트폰 갤러리 저장 / 공유 팝업 창 호출)
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    files: [file],
                    title: '전북 현대 베스트 11',
                    text: '내셔널 전북 현대 스쿼드 빌더 결과물입니다.'
                }).catch(err => {
                    console.log('Share canceled or failed', err);
                });
            } else {
                // PC 또는 미지원 브라우저용 강제 다운로드 백업
                const url = URL.createObjectURL(capturedBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'jeonbuk-squad.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function closeImageModal() {
            document.getElementById('image-modal').style.display = 'none';
        }

        render();
    </script>
</body>
