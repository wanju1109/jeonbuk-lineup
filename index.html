<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북 현대 스쿼드 빌더</title>
    <!-- HTML을 이미지로 변환해주는 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .top-bar {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .top-bar select, .top-bar button {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .top-bar select {
            background-color: #333;
            color: #fff;
        }

        .top-bar button {
            background-color: #2e7d32;
            color: #fff;
        }
        .top-bar button:hover {
            background-color: #1b5e20;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        #pitch-wrapper {
            background-color: #2e7d32;
            border: 3px solid #ffffff;
            border-radius: 8px;
            position: relative;
            width: 480px;
            height: 680px;
            overflow: hidden;
        }

        #pitch {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .pitch-line {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
        .center-line { top: 50%; left: 0; width: 100%; height: 0; }
        .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box.top { top: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-top: none; }
        .penalty-box.bottom { bottom: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-bottom: none; }

        /* 포메이션 슬롯 (선수가 들어갈 빈 자리) */
        .position-slot {
            position: absolute;
            width: 55px;
            height: 65px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            background-color: rgba(0, 0, 0, 0.15);
            pointer-events: auto;
        }

        #bench {
            width: 300px;
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 8px;
            height: 680px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #bench h3 {
            margin-top: 0;
            text-align: center;
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
            font-size: 16px;
        }

        .position-group {
            margin-bottom: 15px;
        }
        .position-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            border-bottom: 1px dashed #444;
            padding-bottom: 3px;
            font-weight: bold;
        }
        .sub-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 65px;
            cursor: grab;
            z-index: 10;
        }
        .player-card:active {
            cursor: grabbing;
        }

        .player-img, .player-info, .player-placeholder {
            pointer-events: none; 
        }

        .player-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            background-color: #fff;
        }

        .player-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background-color: #004d40;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .player-info {
            background-color: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 3px;
            white-space: nowrap;
            text-align: center;
            font-weight: bold;
        }

        .starter {
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <label for="formation-select">포메이션 선택:</label>
        <select id="formation-select" onchange="changeFormation()">
            <option value="4-3-3">4-3-3</option>
            <option value="4-2-3-1">4-2-3-1</option>
            <option value="3-5-2">3-5-2</option>
        </select>
        <button onclick="downloadImage()">📸 베스트 11 이미지 저장</button>
    </div>

    <div class="container">
        <!-- 캡처 대상 영역 -->
        <div id="pitch-wrapper">
            <div id="pitch">
                <div class="pitch-line center-line"></div>
                <div class="pitch-line center-circle"></div>
                <div class="pitch-line penalty-box top"></div>
                <div class="pitch-line penalty-box bottom"></div>
            </div>
        </div>

        <div id="bench">
            <h3>대기 / 교체 선수단</h3>
            <div class="position-group">
                <div class="position-title">GK</div>
                <div id="sub-list-GK" class="sub-list"></div>
            </div>
            <div class="position-group">
                <div class="position-title">DF</div>
                <div id="sub-list-DF" class="sub-list"></div>
            </div>
            <div class="position-group">
                <div class="position-title">MF</div>
                <div id="sub-list-MF" class="sub-list"></div>
            </div>
            <div class="position-group">
                <div class="position-title">FW</div>
                <div id="sub-list-FW" class="sub-list"></div>
            </div>
        </div>
    </div>

    <script>
        const squad = [
            // 공격수 (FW)
            { id: 7,  backNo: "7",  name: "이동준", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20170121.png", slotId: null },
            { id: 9,  backNo: "9",  name: "티아고", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20220244.png", slotId: null },
            { id: 10, backNo: "10", name: "이승우", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20220042.png", slotId: null },
            { id: 11, backNo: "11", name: "김승섭", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20180212.png", slotId: null },
            { id: 21, backNo: "21", name: "츄마시", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20250335.png", slotId: null },
            { id: 81, backNo: "81", name: "기티스", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20260224.png", slotId: null },
            { id: 95, backNo: "95", name: "이탈로", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20260365.png", slotId: null },
            { id: 96, backNo: "96", name: "콤파뇨", pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20250061.png", slotId: null },
            { id: 99, backNo: "99", name: "모따",  pos: "FW", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20230224.png", slotId: null },
            { id: 100, backNo: "-", name: "도도", pos: "FW", img: "", slotId: null },

            // 미드필더 (MF)
            { id: 6,  backNo: "6",  name: "맹성웅", pos: "MF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20190084.png", slotId: null },
            { id: 13, backNo: "13", name: "강상윤", pos: "MF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20220276.png", slotId: null },
            { id: 16, backNo: "16", name: "감보아", pos: "MF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20250353.png", slotId: null },
            { id: 28, backNo: "28", name: "이영재", pos: "MF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20150104.png", slotId: null },
            { id: 73, backNo: "73", name: "김예건", pos: "MF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20260293.png", slotId: null },
            { id: 97, backNo: "97", name: "김진규", pos: "MF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20150052.png", slotId: null },

            // 수비수 (DF)
            { id: 2,  backNo: "2",  name: "김영빈", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20140143.png", slotId: null },
            { id: 3,  backNo: "3",  name: "연제운", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20160157.png", slotId: null },
            { id: 4,  backNo: "4",  name: "조위제", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20220174.png", slotId: null },
            { id: 5,  backNo: "5",  name: "박지수", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20130142.png", slotId: null },
            { id: 15, backNo: "15", name: "김하준", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20230250.png", slotId: null },
            { id: 23, backNo: "23", name: "김태환", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20100052.png", slotId: null },
            { id: 24, backNo: "24", name: "이상명", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20250159.png", slotId: null },
            { id: 66, backNo: "66", name: "최우진", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20230029.png", slotId: null },
            { id: 77, backNo: "77", name: "김태현", pos: "DF", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20180185.png", slotId: null },

            // 골키퍼 (GK)
            { id: 1,  backNo: "1",  name: "이주현", pos: "GK", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20190057.png", slotId: null },
            { id: 31, backNo: "31", name: "송범근", pos: "GK", img: "https://jbhd-upload-file.s3.ap-northeast-2.amazonaws.com/images/player/2026/20180025.png", slotId: null }
        ];

        // 포메이션별 슬롯 좌표 정의 (백분율 %)
        const formations = {
            "4-3-3": [
                { id: "GK", label: "GK", x: 50, y: 90 },
                { id: "LB", label: "LB", x: 15, y: 75 },
                { id: "CB1", label: "CB", x: 38, y: 78 },
                { id: "CB2", label: "CB", x: 62, y: 78 },
                { id: "RB", label: "RB", x: 85, y: 75 },
                { id: "LM", label: "LCM", x: 30, y: 52 },
                { id: "CM", label: "CM", x: 50, y: 58 },
                { id: "RM", label: "RCM", x: 70, y: 52 },
                { id: "LW", label: "LW", x: 18, y: 25 },
                { id: "ST", label: "ST", x: 50, y: 20 },
                { id: "RW", label: "RW", x: 82, y: 25 }
            ],
            "4-2-3-1": [
                { id: "GK", label: "GK", x: 50, y: 90 },
                { id: "LB", label: "LB", x: 15, y: 75 },
                { id: "CB1", label: "CB", x: 38, y: 78 },
                { id: "CB2", label: "CB", x: 62, y: 78 },
                { id: "RB", label: "RB", x: 85, y: 75 },
                { id: "DM1", label: "LDM", x: 38, y: 60 },
                { id: "DM2", label: "RDM", x: 62, y: 60 },
                { id: "LM", label: "LAM", x: 20, y: 38 },
                { id: "AM", label: "CAM", x: 50, y: 40 },
                { id: "RM", label: "RAM", x: 80, y: 38 },
                { id: "ST", label: "ST", x: 50, y: 20 }
            ],
            "3-5-2": [
                { id: "GK", label: "GK", x: 50, y: 90 },
                { id: "CB1", label: "LCB", x: 25, y: 78 },
                { id: "CB2", label: "CB", x: 50, y: 80 },
                { id: "CB3", label: "RCB", x: 75, y: 78 },
                { id: "LWB", label: "LWB", x: 15, y: 52 },
                { id: "CM1", label: "LCM", x: 38, y: 55 },
                { id: "CM2", label: "CM", x: 50, y: 45 },
                { id: "CM3", label: "RCM", x: 62, y: 55 },
                { id: "RWB", label: "RWB", x: 85, y: 52 },
                { id: "ST1", label: "LS", x: 38, y: 22 },
                { id: "ST2", label: "RS", x: 62, y: 22 }
            ]
        };

        let currentFormation = "4-3-3";

        function render() {
            const pitch = document.getElementById('pitch');
            
            // 기존 슬롯 및 카드 제거 (라인은 유지)
            document.querySelectorAll('.position-slot, #pitch .player-card').forEach(el => el.remove());
            ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
                document.getElementById(`sub-list-${pos}`).innerHTML = '';
            });

            // 현재 포메이션 슬롯 생성
            const slots = formations[currentFormation];
            slots.forEach(slot => {
                const slotEl = document.createElement('div');
                slotEl.className = 'position-slot';
                slotEl.dataset.slotId = slot.id;
                slotEl.style.left = slot.x + '%';
                slotEl.style.top = slot.y + '%';
                slotEl.innerText = slot.label;

                // 슬롯에 드롭 이벤트 설정 (스냅)
                slotEl.ondragover = (e) => e.preventDefault();
                slotEl.ondrop = (e) => {
                    e.preventDefault();
                    const playerId = parseInt(e.dataTransfer.getData('playerId'));
                    
                    // 이미 이 슬롯에 다른 선수가 있다면 그 선수는 벤치로 보냄
                    squad.forEach(p => {
                        if (p.slotId === slot.id) p.slotId = null;
                    });

                    const player = squad.find(p => p.id === playerId);
                    if (player) {
                        player.slotId = slot.id;
                        render();
                    }
                };

                pitch.appendChild(slotEl);
            });

            // 선수 카드 배치
            squad.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.draggable = true;

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('playerId', player.id);
                };

                if (player.img) {
                    const img = document.createElement('img');
                    img.src = player.img;
                    img.className = 'player-img';
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'player-placeholder';
                    placeholder.innerText = player.name;
                    card.appendChild(placeholder);
                }

                const info = document.createElement('div');
                info.className = 'player-info';
                info.innerText = `${player.backNo}. ${player.name}`;
                card.appendChild(info);

                if (player.slotId) {
                    // 필드 슬롯에 배치된 경우
                    const targetSlot = document.querySelector(`.position-slot[data-slot-id="${player.slotId}"]`);
                    if (targetSlot) {
                        card.classList.add('starter');
                        // 슬롯 위치에 맞춤
                        card.style.left = targetSlot.style.left;
                        card.style.top = targetSlot.style.top;
                        pitch.appendChild(card);
                        targetSlot.style.color = 'transparent'; // 선수가 올라가면 글자 숨김
                    } else {
                        player.slotId = null;
                    }
                } else {
                    // 대기실에 배치된 경우
                    const targetList = document.getElementById(`sub-list-${player.pos}`);
                    if (targetList) {
                        targetList.appendChild(card);
                    }
                }
            });
        }

        function changeFormation() {
            const select = document.getElementById('formation-select');
            currentFormation = select.value;
            // 포메이션이 바뀌면 기존 배치 초기화 또는 유지 (여기선 깔끔하게 초기화)
            squad.forEach(p => p.slotId = null);
            render();
        }

        // 벤치 드롭 영역 (선수를 다시 벤치로 내릴 때)
        const bench = document.getElementById('bench');
        bench.ondragover = (e) => e.preventDefault();
        bench.ondrop = (e) => {
            e.preventDefault();
            const playerId = parseInt(e.dataTransfer.getData('playerId'));
            const player = squad.find(p => p.id === playerId);
            if (!player) return;

            player.slotId = null;
            render();
        };

        // 이미지 복사(다운로드) 함수
        function downloadImage() {
            const target = document.getElementById('pitch-wrapper');
            html2canvas(target, { backgroundColor: null, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'jeonbuk-squad.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        render();
    </script>
</body>
</html>
