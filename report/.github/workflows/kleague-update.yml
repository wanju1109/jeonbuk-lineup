name: Update K LEAGUE data

on:
  schedule:
    # GitHub Actions cron uses UTC. These run roughly every 6 hours.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kleague-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Collect official K LEAGUE data
        env:
          KLEAGUE_YEAR: ""
        run: |
          set -e
          if [ -z "$KLEAGUE_YEAR" ]; then
            export KLEAGUE_YEAR="$(TZ=Asia/Seoul date +%Y)"
          fi
          python scripts/collect_kleague.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No K LEAGUE data changes."
            exit 0
          fi

          git commit -m "chore: update K LEAGUE data"
          git push
