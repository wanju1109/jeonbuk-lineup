<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K LEAGUE 경기 분석 리포트</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--line:#dfe4e8;--text:#17212b;--muted:#6b7680;
  --home:#00523D;--away:#EE7501;--accent:#0b6b55;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
h1{margin:0 0 8px;font-size:28px}
.sub{color:var(--muted);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #00000008}
.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
select,button{width:100%;height:42px;border:1px solid #cfd6dc;border-radius:8px;background:#fff;padding:0 12px;font-size:14px}
button{background:#111;color:#fff;border-color:#111;cursor:pointer;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.status{padding:12px 14px;border-radius:9px;background:#f7f8f9;color:#4c5862;font-size:13px;white-space:pre-wrap}
.error{background:#fff1f0;color:#b42318;border:1px solid #ffd2cf}
.notice{background:#fff9e8;color:#805b00;border:1px solid #f0d78c}
.hidden{display:none}
.match-head{display:grid;grid-template-columns:1fr 220px 1fr;gap:20px;align-items:center;text-align:center}
.team{font-size:28px;font-weight:800}
.home{color:var(--home)} .away{color:var(--away)}
.score{font-size:42px;font-weight:900}
.meta{font-size:13px;color:var(--muted);line-height:1.8}
.tabs{display:flex;gap:8px;margin:18px 0}
.tab{width:auto;background:#fff;color:#222;border-color:#cfd6dc}
.tab.active{background:#111;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpi-title{font-size:16px;font-weight:800;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:13px;text-align:center}
.kpi .n{font-size:24px;font-weight:800}.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
.table th:first-child,.table td:first-child{text-align:left}
.table th:nth-child(2),.table td:nth-child(2){color:var(--home);font-weight:700}
.table th:nth-child(3),.table td:nth-child(3){color:var(--away);font-weight:700}
.barrow{display:grid;grid-template-columns:1fr 110px 1fr;gap:8px;align-items:center;margin:10px 0}
.barwrap{height:14px;background:#eef1f3;border-radius:8px;overflow:hidden;display:flex}
.barL{height:100%;margin-left:auto;background:var(--home)}
.barR{height:100%;background:var(--away)}
.metric{text-align:center;font-size:12px;font-weight:700}
.recent{display:grid;gap:7px}
.recent-row{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line);font-size:13px}
.recent-row span:first-child{text-align:right}.recent-row span:last-child{text-align:left}
.footer{font-size:12px;color:var(--muted);line-height:1.7}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.match-head{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>K LEAGUE 경기 분석 리포트</h1>
  <div class="sub">K LEAGUE 공식 사이트/데이터 포털의 실제 데이터를 조회합니다. 조회 실패 시 임의 데이터를 표시하지 않습니다.</div>

  <div class="card">
    <div class="controls">
      <div>
        <label>대회</label>
        <select id="league">
          <option value="1">K리그1</option>
          <option value="2">K리그2</option>
        </select>
      </div>
      <div>
        <label>연도</label>
        <select id="year"></select>
      </div>
      <div>
        <label>라운드</label>
        <select id="round"></select>
      </div>
      <div>
        <label>경기</label>
        <select id="match"></select>
      </div>
      <div><button id="analyze" disabled>분석하기</button></div>
    </div>
    <div id="status" class="status" style="margin-top:12px">실제 K LEAGUE 데이터를 준비하는 중입니다.</div>
  </div>

  <div id="report" class="hidden">
    <div class="card">
      <div class="match-head">
        <div>
          <div id="homeName" class="team home">-</div>
          <div id="homeId" class="meta">-</div>
        </div>
        <div>
          <div id="score" class="score">-</div>
          <div id="matchMeta" class="meta">-</div>
        </div>
        <div>
          <div id="awayName" class="team away">-</div>
          <div id="awayId" class="meta">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="kpi-title">통산전적</div>
      <div id="h2hKpi" class="kpis"></div>
      <div class="grid2" style="margin-top:18px">
        <div>
          <div class="kpi-title">통산 득점</div>
          <div id="h2hGoals"></div>
        </div>
        <div>
          <div class="kpi-title">최근 10경기</div>
          <div id="recent10"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-cat="attack">공격</button>
        <button class="tab" data-cat="pass">패스</button>
        <button class="tab" data-cat="def">수비</button>
      </div>
      <div id="metrics"></div>
    </div>

    <div class="card">
      <div class="kpi-title">데이터 출처</div>
      <div class="footer">
        K LEAGUE 공식 일정/결과 및 K LEAGUE 데이터 포털을 기준으로 조회합니다.<br>
        데이터 포털의 부가기록은 Bepro11 영상 기반 기록이며 공식기록과 차이가 날 수 있습니다.
      </div>
    </div>
  </div>
</div>

<script>
/*
 * p_report.html
 *
 * 중요한 원칙:
 * 1. 경기/통계 숫자를 임의로 만들지 않습니다.
 * 2. 공식 K LEAGUE 응답을 읽지 못하면 report를 표시하지 않습니다.
 * 3. 브라우저의 CORS 정책 때문에 직접 접근이 차단되는 경우
 *    같은 사이트의 /api/kleague 프록시를 사용할 수 있습니다.
 *
 * 권장 배포 구조:
 *   /jeonbuk-lineup/report/p_report.html
 *   /jeonbuk-lineup/api/kleague
 *
 * proxy는 아래 URL을 받아 K LEAGUE 원본을 그대로 반환하도록 구성하면 됩니다.
 *
 *   /api/kleague?url=<URL encoded official URL>
 *
 * 이 HTML에는 가짜 경기/통계 데이터가 들어 있지 않습니다.
 */

const OFFICIAL = {
  schedule: "https://portal.kleague.com/view/schedule/list.do",
  matchChart: "https://portal.kleague.com/data/matc/matchChart.do",
  matchChartPre: "https://portal.kleague.com/data/matc/matchChartPre.do"
};

/*
 * 브라우저 CORS를 피하기 위해 공개 GET 릴레이를 먼저 사용하고,
 * 실패하면 같은 사이트의 /api/kleague 프록시를 사용합니다.
 *
 * 릴레이는 데이터를 생성하지 않습니다. 지정한 URL의 K LEAGUE 응답을
 * 그대로 전달하는 역할만 합니다.
 */
const RELAYS = [
  "https://api.allorigins.win/raw?url=",
  "/api/kleague?url="
];

const $ = id => document.getElementById(id);
const league = $("league"), year = $("year"), round = $("round"), match = $("match");
const analyze = $("analyze"), statusBox = $("status"), report = $("report");

let scheduleMatches = [];
let selectedMatch = null;
let chartData = null;

function setStatus(text, type="") {
  statusBox.className = "status " + type;
  statusBox.textContent = text;
}

function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[s]));
}

function officialUrl(url) {
  if (!PROXY_BASE) return url;
  return PROXY_BASE + "?url=" + encodeURIComponent(url);
}

async function getText(url) {
  let last = null;
  for (const relay of RELAYS) {
    try {
      const target = relay.startsWith("http")
        ? relay + encodeURIComponent(url)
        : relay + encodeURIComponent(url);

      const r = await fetch(target, {
        method:"GET",
        cache:"no-store"
      });
      const text = await r.text();
      if (!r.ok) {
        last = new Error("HTTP " + r.status + ": " + text.slice(0,500));
        continue;
      }
      if (text && text.length > 50) return text;
      last = new Error("빈 응답");
    } catch(e) {
      last = e;
    }
  }
  throw last || new Error("데이터 릴레이 요청 실패");
}

/*
 * K LEAGUE 포털의 schedule 페이지는 연/월 단위 캘린더입니다.
 * 여기서는 실제 페이지의 링크/onclick/hidden 값을 찾아 game_id/round_id 등을
 * 확보합니다. 포털의 HTML이 변경되어도 가능한 여러 패턴을 시도합니다.
 */
function parseScheduleHtml(html, y, leagueId) {
  const found = [];
  const doc = new DOMParser().parseFromString(html, "text/html");

  const add = obj => {
    if (!obj.home || !obj.away) return;
    obj.year = obj.year || String(y);
    obj.league = obj.league || String(leagueId);
    obj.round = obj.round != null ? String(obj.round) : "";
    obj.home = cleanTeam(obj.home);
    obj.away = cleanTeam(obj.away);
    obj.date = obj.date || "";
    obj.time = obj.time || "";
    obj.gameId = obj.gameId || "";
    obj.meetSeq = obj.meetSeq || "";
    obj.roundId = obj.roundId || obj.round || "";
    obj.url = obj.url || "";
    const key = [obj.year,obj.round,obj.date,obj.home,obj.away,obj.gameId].join("|");
    if (!found.some(x => x._key === key)) {
      obj._key = key;
      found.push(obj);
    }
  };

  // 1) href/onclick 안에 들어있는 game_id, round_id 등의 실제 값을 우선 추출
  doc.querySelectorAll("[href],[onclick]").forEach(el => {
    const raw = (el.getAttribute("href") || "") + " " + (el.getAttribute("onclick") || "");
    const p = parseParams(raw);
    const text = (el.textContent || "").replace(/\s+/g," ").trim();

    if (p.game_id || p.gameId) {
      const teams = parseTeams(text);
      if (teams) add({
        home:teams.home, away:teams.away,
        gameId:p.game_id || p.gameId,
        roundId:p.round_id || p.roundId || "",
        round:p.round || p.round_id || "",
        meetSeq:p.meet_seq || p.meetSeq || "",
        date:p.game_date || p.gameDate || "",
        time:p.game_time || p.gameTime || "",
        url: absoluteUrl(raw)
      });
    }
  });

  // 2) 실제 페이지 텍스트에 남는 "전북 : 제주 (1:3)" / "전북 : 제주 20:00" 패턴
  const bodyText = doc.body ? doc.body.innerText.replace(/\u00a0/g," ") : "";
  const re = /([가-힣A-Za-z0-9 .·_-]{1,20})\s*:\s*([가-힣A-Za-z0-9 .·_-]{1,20})\s*(?:\((\d+)\s*:\s*(\d+)\)|(\d{1,2}:\d{2}))/g;
  let m;
  while ((m = re.exec(bodyText))) {
    const h = cleanTeam(m[1]), a = cleanTeam(m[2]);
    if (!h || !a || h === "미정" || a === "미정") continue;
    add({home:h,away:a,time:m[5] || "",date:""});
  }

  return found;
}

function parseParams(s) {
  const out = {};
  const re = /(?:[?&;\s])([A-Za-z_][A-Za-z0-9_]*)\s*=\s*["']?([^&;"'\s,)]+)/g;
  let m;
  while ((m = re.exec(s))) out[m[1]] = decodeURIComponent(m[2]);
  return out;
}

function absoluteUrl(raw) {
  const x = raw.match(/https?:\/\/[^"' )]+/);
  return x ? x[0] : "";
}

function cleanTeam(s) {
  return String(s || "")
    .replace(/\([^)]*\)/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function parseTeams(text) {
  const m = text.match(/(.+?)\s*:\s*(.+?)(?:\s*\(|\s+\d{1,2}:\d{2}|$)/);
  return m ? {home:cleanTeam(m[1]),away:cleanTeam(m[2])} : null;
}

function fillYears() {
  year.innerHTML = "";
  const now = new Date().getFullYear();
  for (let y = now; y >= 2018; y--) {
    const o = document.createElement("option");
    o.value = y; o.textContent = y;
    year.appendChild(o);
  }
  year.value = String(now);
}

function fillRounds() {
  round.innerHTML = '<option value="">라운드 선택</option>';
  // K리그 정규 라운드는 실제 선택 가능한 라운드 번호 자체를 표시합니다.
  // 경기 데이터는 이후 공식 페이지에서 실제 존재 여부를 확인합니다.
  const max = league.value === "1" ? 33 : 39;
  for (let i=1;i<=max;i++) {
    const o=document.createElement("option");
    o.value=String(i); o.textContent=i+"라운드";
    round.appendChild(o);
  }
  match.innerHTML='<option value="">경기 선택</option>';
  analyze.disabled=true;
}

async function loadMatches() {
  const y = year.value;
  const lid = league.value;
  const r = round.value;
  if (!r) return;

  setStatus("공식 K LEAGUE 일정 데이터를 조회하는 중입니다…");
  match.innerHTML='<option value="">조회 중…</option>';
  analyze.disabled=true;

  /*
   * 일정 페이지는 월 단위이므로 해당 연도의 모든 월을 조회합니다.
   * 실제 경기 목록은 응답에서 수집하고 round_id/game_id가 있으면 그대로 사용합니다.
   */
  const all = [];
  for (let month=1; month<=12; month++) {
    try {
      const url = OFFICIAL.schedule +
        "?year=" + encodeURIComponent(y) +
        "&month=" + String(month).padStart(2,"0") +
        "&leagueId=" + encodeURIComponent(lid);
      const html = await getText(url);
      all.push(...parseScheduleHtml(html,y,lid));
    } catch(e) {
      // 한 달 실패 때문에 전체를 가짜 데이터로 채우지 않습니다.
    }
  }

  scheduleMatches = all.filter(x => {
    return !x.round || String(x.round) === String(r) ||
           String(x.roundId) === String(r);
  });

  // round_id를 페이지에서 못 얻은 경우, 날짜/경기명만 보여주는 것을 방지합니다.
  // 실제 matchChart 요청에 필요한 식별자가 있는 경기만 분석 대상으로 허용합니다.
  const usable = scheduleMatches.filter(x => x.gameId || x.url);

  match.innerHTML='<option value="">경기 선택</option>';
  usable.forEach((x,i)=>{
    const o=document.createElement("option");
    o.value=String(i);
    o.textContent =
      (x.date ? x.date+" " : "") +
      (x.time ? x.time+" " : "") +
      x.home+" : "+x.away;
    match.appendChild(o);
  });

  if (!usable.length) {
    setStatus(
      "공식 K LEAGUE 일정 페이지에서 이 라운드의 경기 식별자(game_id)를 확보하지 못했습니다.\n\n"+
      "이 페이지는 식별자를 확인하지 못한 경기를 임의로 만들어 분석하지 않습니다.\n"+
      "브라우저 개발자도구 Network에서 K LEAGUE 일정 페이지의 실제 경기 상세 요청을 확인한 뒤 "+
      "/api/kleague가 그 URL을 전달하도록 연결하면 됩니다.",
      "notice"
    );
    return;
  }

  setStatus("실제 경기 "+usable.length+"건을 확인했습니다. 경기를 선택하세요.");
}

async function loadChart() {
  const idx = Number(match.value);
  const usable = scheduleMatches.filter(x => x.gameId || x.url);
  selectedMatch = usable[idx];
  if (!selectedMatch) return;

  setStatus("선택한 경기의 실제 경기 분석 데이터를 조회하는 중입니다…");

  const urls = [];

  if (selectedMatch.url) urls.push(selectedMatch.url);

  const q = new URLSearchParams();
  if (selectedMatch.year) q.set("meet_year", selectedMatch.year);
  if (selectedMatch.meetSeq) q.set("meet_seq", selectedMatch.meetSeq);
  if (selectedMatch.gameId) q.set("game_id", selectedMatch.gameId);
  if (selectedMatch.roundId) q.set("round_id", selectedMatch.roundId);

  urls.push(OFFICIAL.matchChartPre + "?" + q.toString());
  urls.push(OFFICIAL.matchChart + "?" + q.toString());

  let html = "";
  let lastErr = "";
  for (const u of urls) {
    try {
      html = await getText(u);
      if (html && (html.includes("chartCompDataSet") || html.includes("chartMatchDataSet"))) break;
    } catch(e) {
      lastErr = e.message;
    }
  }

  if (!html || !html.includes("chartCompDataSet")) {
    setStatus(
      "실제 K LEAGUE 경기 분석 데이터를 가져오지 못했습니다.\n\n"+
      (lastErr || "matchChart 응답에서 chartCompDataSet을 찾지 못했습니다.")+
      "\n\n가짜 데이터는 표시하지 않습니다.",
      "error"
    );
    return;
  }

  try {
    chartData = parseChartData(html);
    renderReport(chartData);
    report.classList.remove("hidden");
    setStatus("실제 K LEAGUE 데이터로 분석을 표시했습니다.");
  } catch(e) {
    setStatus("K LEAGUE 응답을 분석하는 중 오류가 발생했습니다.\n"+e.message+"\n\n가짜 데이터는 표시하지 않습니다.","error");
  }
}

function extractVar(html,name) {
  const re = new RegExp("var\\s+"+name+"\\s*=\\s*(\\[\\[.*?\\]\\]);","s");
  const m = html.match(re);
  if (!m) throw new Error(name+"을 찾지 못했습니다.");
  return Function('"use strict";return ('+m[1]+')')();
}

function parseChartData(html) {
  const matchSet = extractVar(html,"chartMatchDataSet");
  const compSet = extractVar(html,"chartCompDataSet");

  const meta = matchSet[0]?.[0];
  const h2h = matchSet[1]?.[0];
  const recent = matchSet[2]?.[0];
  const recentList = matchSet[3] || [];
  if (!meta || !compSet?.length) throw new Error("필수 경기 데이터가 없습니다.");

  return {meta,h2h,recent,recentList,attack:compSet[0]||[],pass:compSet[1]||[],def:compSet[2]||[]};
}

function num(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function pct(a,b){ return b ? (a/b*100).toFixed(1)+"%" : "-"; }

function renderReport(d) {
  $("homeName").textContent=d.meta.H_Name || d.meta.H_S_Name || d.meta.home_team || "-";
  $("awayName").textContent=d.meta.A_Name || d.meta.A_S_Name || d.meta.away_team || "-";
  $("homeId").textContent=d.meta.home_team || "";
  $("awayId").textContent=d.meta.away_team || "";
  $("score").textContent=(d.meta.home_score != null && d.meta.away_score != null)
    ? d.meta.home_score+" : "+d.meta.away_score : "경기";
  $("matchMeta").innerHTML=
    escapeHtml(d.meta.game_date||"")+
    (d.meta.game_time ? " "+escapeHtml(d.meta.game_time):"")+
    "<br>"+escapeHtml(d.meta.field_Name||"");

  if (d.h2h) {
    $("h2hKpi").innerHTML =
      kpi(d.h2h.win_qty,"전북/홈 승")+
      kpi(d.h2h.loss_qty,"제주/원정 승")+
      kpi(d.h2h.tie_qty,"무승부");
    $("h2hGoals").innerHTML = simpleBars(
      [["홈",num(d.h2h.gain_goal_qty)],["원정",num(d.h2h.loss_goal_qty)]]
    );
  }

  if (d.recent) {
    $("recent10").innerHTML =
      kpi(d.recent.win,"홈 승")+
      kpi(d.recent.loss,"원정 승")+
      kpi(d.recent.draw,"무승부");
  }

  renderMetrics("attack",d.attack);
}

function kpi(n,l){
  return '<div class="kpi"><div class="n">'+escapeHtml(n)+'</div><div class="l">'+escapeHtml(l)+'</div></div>';
}

function simpleBars(items){
  const max=Math.max(...items.map(x=>x[1]),1);
  return items.map((x,i)=>
    '<div class="barrow"><div style="text-align:right;font-weight:700">'+escapeHtml(x[0])+' '+x[1]+'</div>'+
    '<div class="barwrap"><div class="'+(i===0?"barL":"barR")+'" style="width:'+(x[1]/max*100)+'%"></div></div>'+
    '<div></div></div>'
  ).join("");
}

const defs = {
  attack:[
    ["GOAL_CNT","득점"],["ASSIST_CNT","도움"],["SHOT","슈팅"],["SHOT_ON_TARGET","유효슈팅"],
    ["DEFENDER_BLOCKED_SHOT","블락된 슈팅"],["SHOOTING_OFF","벗어난 슈팅"],["SHOOTING_IN_PA","PA내 슈팅"],
    ["SHOOTING_OUT_PA","PA외 슈팅"],["OFFSIDE","오프사이드"],["FREEKICK_SHOT_ON_TARGET","프리킥 유효슈팅"],
    ["F_CROSS_ACC","프리킥 크로스 성공"],["CORNER","코너킥"],["THROW_INS","스로인"],["DRIBBLE_SUCCESS","드리블 돌파 성공"]
  ],
  pass:[
    ["PASS_ACC","패스 성공"],["EXTRA_ATT_AND_KEYPASS","키패스"],["DEFS_AREA_PASS_SUCCESS","수비진영 패스"],
    ["LONG_PASS_SUCCESS","롱패스"],["SHORT_PASS_SUCCESS","단거리 패스"],["PASS_F_ACC_CA_DEG","전진패스"],
    ["MEDIUM_PASS_SUCCESS","중거리 패스"],["TRANSVERSE_PASS_SUCCESS","횡패스"],["PASS_B_ACC_CA_DEG","후방패스"],
    ["CROSS_ACC","크로스"],["ATT_AREA_PASS_SUCCESS","공격진영 패스"],["MIDDLE_AREA_PASS_SUCCESS","중앙지역 패스"],
    ["CONTROL_UNDER_PRESSURE","탈압박"]
  ],
  def:[
    ["TACKLE_SUCCESS","태클"],["AIR_CHAG_WON","경합(공중)"],["CHAG_WON","경합(지상)"],
    ["INTERCEPT","인터셉트"],["KICK_OUT","클리어링"],["CUT_OFF","차단"],["BALL_RECOVERIE","획득"],
    ["BLOCKING_SHOOT","블락"],["BALL_MISS","볼미스"],["FOUL","파울"],["FOUL_OPP","피파울"],
    ["warn_qty","경고"],["exit_qty","퇴장"],["GOAL_CONCEDED","실점"],["CATCH","캐칭"],
    ["PUNCH","펀칭"],["GOAL_KICK_SUCCESS","골킥"],["AIR_CLEARANCES_SUCCESS","공중 클리어링"]
  ]
};

function renderMetrics(cat, rows){
  const homeId=chartData.meta.home_team;
  const awayId=chartData.meta.away_team;
  const home=rows.find(x=>x.team_id===homeId) || rows[0];
  const away=rows.find(x=>x.team_id===awayId) || rows[1];
  if(!home || !away) {
    $("metrics").innerHTML='<div class="status error">선택한 경기의 '+cat+' 실제 데이터가 없습니다.</div>';
    return;
  }

  $("metrics").innerHTML=defs[cat].map(([key,label])=>{
    const a=num(home[key]), b=num(away[key]), max=Math.max(a,b,1);
    return '<div class="barrow">'+
      '<div style="text-align:right;font-weight:800;color:var(--home)">'+a+'</div>'+
      '<div class="metric">'+escapeHtml(label)+'</div>'+
      '<div style="font-weight:800;color:var(--away)">'+b+'</div>'+
      '</div>'+
      '<div class="barrow" style="margin-top:-7px">'+
      '<div><div class="barwrap"><div class="barL" style="width:'+(a/max*100)+'%"></div></div></div>'+
      '<div></div>'+
      '<div><div class="barwrap"><div class="barR" style="width:'+(b/max*100)+'%"></div></div></div>'+
      '</div>';
  }).join("");
}

league.addEventListener("change",fillRounds);
year.addEventListener("change",fillRounds);
round.addEventListener("change",loadMatches);
match.addEventListener("change",()=>{ analyze.disabled = match.value===""; });
analyze.addEventListener("click",loadChart);

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    renderMetrics(btn.dataset.cat,chartData[btn.dataset.cat]||[]);
  });
});

);
