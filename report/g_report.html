<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeonbuk Hyundai Motors - Elite Match Analytics</title>
    <!-- Chart.js for Advanced Radar & Stats -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas for High-Resolution Image Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome for Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-panel: #131b2e;
            --bg-card: #1b263b;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --jb-green: #00a651;
            --jb-green-glow: rgba(0, 166, 81, 0.3);
            --jb-gold: #d8b53a;
            --accent-red: #ff5252;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 25px;
        }

        /* Top Control Bar */
        .control-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        select {
            background: var(--bg-deep);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .action-btn {
            background: var(--jb-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--jb-green-glow);
        }
        .action-btn:hover { filter: brightness(1.1); }

        .btn-export {
            background: var(--jb-gold);
            color: #111;
            box-shadow: 0 0 15px rgba(216, 181, 58, 0.3);
        }

        /* Hidden / Collapsible Data Input Area */
        .data-drawer {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .data-drawer textarea {
            width: 100%;
            height: 80px;
            background: #05070b;
            color: #00ff88;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        /* Main Dashboard Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* Match Header Banner */
        .match-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .team-box { text-align: center; flex: 1; }
        .team-box h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
        .match-vs { font-size: 28px; font-weight: 900; color: var(--jb-gold); padding: 0 20px; }

        /* Professional SVG Pitch Styles */
        .pitch-container {
            background: #1b3b22;
            border: 2px solid rgba(255,255,255,0.8);
            height: 480px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }
        svg { width: 100%; height: 100%; }

        /* Right Panel: Metrics & Timeline */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-title { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .metric-value { font-size: 22px; font-weight: 800; color: var(--jb-green); margin-top: 5px; display: block; }

        /* Timeline Log Stream */
        .timeline-box {
            background: var(--bg-deep);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 320px;
            overflow-y: auto;
            padding: 15px;
        }
        .timeline-box::-webkit-scrollbar { width: 6px; }
        .timeline-box::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        .timeline-event {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--jb-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .timeline-event.shot { border-left-color: var(--accent-red); }
        .timeline-event.goal { border-left-color: var(--jb-gold); background: rgba(216, 181, 58, 0.1); }

        .event-time { font-weight: 700; color: var(--jb-gold); }
        .event-desc { font-weight: 600; flex: 1; margin-left: 15px; }
        .event-meta { font-size: 11px; color: var(--text-muted); background: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Top Control & Filter Bar -->
    <div class="control-panel">
        <div class="control-group">
            <div>
                <label>선수 집중 분석 (Player Focus)</label><br>
                <select id="sel-player" onchange="renderDashboard()">
                    <option value="ALL">전체 선수 통합 보기 (All Players)</option>
                </select>
            </div>
            <div>
                <label>이벤트 필터</label><br>
                <select id="sel-type" onchange="renderDashboard()">
                    <option value="ALL">모든 액션 (All Actions)</option>
                    <option value="SHOT">슈팅 및 득점만 (Shots & Goals)</option>
                    <option value="PASS">패스 네트워크만 (Passes)</option>
                </select>
            </div>
        </div>
        <div class="control-group">
            <button class="action-btn btn-export" onclick="exportDashboardImage()">
                <i class="fa-solid fa-camera"></i> 커뮤니티 이미지 복사
            </button>
        </div>
    </div>

    <!-- Data Injection Drawer -->
    <div class="data-drawer">
        <label style="font-size: 12px; color: var(--jb-green); font-weight: 700;">
            <i class="fa-solid fa-database"></i> 실시간 비프로(Bepro) 매치 데이터 스트림 (JSON)
        </label>
        <textarea id="rawData" placeholder="크롬 익스텐션 또는 수동으로 주입된 실제 데이터가 이곳에 기록됩니다..."></textarea>
        <button class="action-btn" style="margin-top: 10px; padding: 6px 15px; font-size: 12px;" onclick="renderDashboard()">
            <i class="fa-solid fa-rotate"></i> 데이터 새로고침 및 렌더링 강제 실행
        </button>
    </div>

    <!-- Main Pro Dashboard Container -->
    <div class="dashboard-grid" id="export-area">
        
        <!-- Left Panel: Tactical Pitch Visualization -->
        <div class="panel">
            <div class="match-banner">
                <div class="team-box">
                    <h2 id="home-team-name">전북 현대 모터스</h2>
                    <span style="font-size: 12px; color: var(--text-muted);">HOME TACTICS</span>
                </div>
                <div class="match-vs">VS</div>
                <div class="team-box">
                    <h2 id="away-team-name" style="color: var(--accent-red);">상대팀 (AWAY)</h2>
                    <span style="font-size: 12px; color: var(--text-muted);">MATCH TRAJECTORY</span>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; font-size: 16px;"><i class="fa-solid fa-chess-board"></i> 전술 패스 및 슈팅 궤적 맵</h3>
                <span id="active-filter-badge" style="font-size: 12px; color: var(--jb-gold);">전체 궤적 활성화</span>
            </div>

            <!-- Professional Pitch SVG -->
            <div class="pitch-container">
                <svg id="pitch-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <defs>
                        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5252" />
                        </marker>
                        <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8b53a" />
                        </marker>
                        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#00a651" />
                        </marker>
                    </defs>

                    <!-- Pitch Markings (White Lines) -->
                    <line x1="50" y1="0" x2="50" y2="100" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
                    <circle cx="50" cy="50" r="15" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <circle cx="50" cy="50" r="0.8" fill="rgba(255,255,255,0.8)" />
                    <!-- Penalty Boxes -->
                    <rect x="0" y="20" width="16.5" height="60" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <rect x="83.5" y="20" width="16.5" height="60" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <!-- Goal Areas -->
                    <rect x="0" y="35" width="5.5" height="30" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <rect x="94.5" y="35" width="5.5" height="30" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>

                    <!-- Dynamic SVG Render Layer -->
                    <g id="tactics-layer"></g>
                </svg>
            </div>
        </div>

        <!-- Right Panel: Quantitative Metrics & Event Stream -->
        <div class="panel" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h3 style="margin-top: 0; font-size: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                    <i class="fa-solid fa-chart-pie"></i> 실시간 데이터 분석 요약
                </h3>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-title">총 이벤트 수</span>
                        <span class="metric-value" id="stat-total">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-title">슈팅 시도</span>
                        <span class="metric-value" id="stat-shots" style="color: var(--accent-red);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-title">패스 성공</span>
                        <span class="metric-value" id="stat-passes" style="color: var(--jb-gold);">0</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-title">기대득점 (xG)</span>
                        <span class="metric-value" id="stat-xg">0.00</span>
                    </div>
                </div>

                <h3 style="font-size: 15px; margin: 20px 0 10px 0;">
                    <i class="fa-solid fa-clock-rotate-left"></i> 경기 타임라인 스트림
                </h3>
                
                <!-- Timeline Event Log Box -->
                <div class="timeline-box" id="timeline-stream">
                    <div style="text-align: center; color: var(--text-muted); padding: 40px 0;">
                        데이터를 주입하면 실시간 로그가 여기에 스트리밍됩니다.
                    </div>
                </div>
            </div>

            <!-- Mini Radar Chart for Team Profile -->
            <div style="margin-top: 20px; height: 160px;">
                <canvas id="miniRadar"></canvas>
            </div>
        </div>

    </div>

    <script>
        // Map K-League / Bepro codes to human-readable Korean labels
        const CODE_MAP = {
            'GL': '⚽ 득점 성공 (Goal)',
            'AST': '👟 어시스트 (Assist)',
            'MST': '❌ 빗나간 슈팅 (Missed Shot)',
            'ST': '🔥 유효 슈팅 (Shot on Target)',
            'BT': '🛡️ 슈팅 차단 (Blocked)',
            'KEYP': '🔑 키 패스 (Key Pass)',
            'PSS': '✅ 패스 성공 (Pass Success)'
        };

        let radarChartObj = null;

        // Core Rendering Engine for Pro Dashboard
        function renderDashboard() {
            const rawJson = document.getElementById('rawData').value.trim();
            const selectedPlayer = document.getElementById('sel-player').value;
            const selectedType = document.getElementById('sel-type').value;

            const tacticsLayer = document.getElementById('tactics-layer');
            const timelineStream = document.getElementById('timeline-stream');
            
            tacticsLayer.innerHTML = '';
            timelineStream.innerHTML = '';

            if (!rawJson) {
                timelineStream.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px 0;">주입된 데이터가 없습니다. 상단 드로어에 JSON을 확인해주세요.</div>';
                return;
            }

            try {
                let events = JSON.parse(rawJson);
                if (!Array.isArray(events)) events = [events];

                // Dynamically populate player dropdown if empty
                const playerSelect = document.getElementById('sel-player');
                if (playerSelect.options.length <= 1) {
                    const uniqueBackNos = [...new Set(events.filter(e => e.back_no !== undefined).map(e => e.back_no))];
                    uniqueBackNos.sort((a, b) => a - b).forEach(num => {
                        const opt = document.createElement('option');
                        opt.value = num;
                        opt.text = `No.${num} 선수`;
                        playerSelect.appendChild(opt);
                    });
                }

                let totalCount = 0;
                let shotCount = 0;
                let passCount = 0;
                let cumulativeXg = 0;

                // Sort events by period and minute/second
                events.sort((a, b) => (a.PERIOD_ID || 1) - (b.PERIOD_ID || 1) || (a.MIN_TIME || 0) - (b.MIN_TIME || 0));

                events.forEach(ev => {
                    const code = ev.TYPE_DETAIL_CD || ev.CLICK_DATA || 'UNKNOWN';
                    const isShot = code.includes('ST') || code === 'GL' || code === 'MST' || code === 'BT';
                    const isPass = code.includes('PSS') || code === 'KEYP' || code === 'AST';

                    // Apply filters
                    if (selectedPlayer !== 'ALL' && String(ev.back_no) !== String(selectedPlayer)) return;
                    if (selectedType === 'SHOT' && !isShot) return;
                    if (selectedType === 'PASS' && !isPass) return;

                    totalCount++;
                    if (isShot) shotCount++;
                    if (isPass) passCount++;
                    if (ev.EXPECTED_GOAL) cumulativeXg += Number(ev.EXPECTED_GOAL);

                    // --- 1. Render SVG Pitch Trajectory ---
                    if (ev.START_POINT_X !== undefined && ev.START_POINT_Y !== undefined) {
                        const sx = ev.START_POINT_X;
                        const sy = ev.START_POINT_Y;
                        const ex = ev.END_POINT_X !== undefined ? ev.END_POINT_X : sx;
                        const ey = ev.END_POINT_Y !== undefined ? ev.END_POINT_Y : ey; // safe fallback

                        const color = code === 'GL' ? '#d8b53a' : (isShot ? '#ff5252' : '#00a651');
                        const marker = code === 'GL' ? 'url(#arrow-gold)' : (isShot ? 'url(#arrow-red)' : 'url(#arrow-green)');

                        // Draw vector line
                        if (sx !== ex || sy !== (ev.END_POINT_Y !== undefined ? ev.END_POINT_Y : sy)) {
                            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                            line.setAttribute("x1", sx); line.setAttribute("y1", sy);
                            line.setAttribute("x2", ex); line.setAttribute("y2", ev.END_POINT_Y !== undefined ? ev.END_POINT_Y : sy);
                            line.setAttribute("stroke", color);
                            line.setAttribute("stroke-width", "0.9");
                            line.setAttribute("marker-end", marker);
                            tacticsLayer.appendChild(line);
                        }

                        // Draw position circle node
                        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                        circle.setAttribute("cx", sx); circle.setAttribute("cy", sy);
                        circle.setAttribute("r", "2.2");
                        circle.setAttribute("fill", "#090d16");
                        circle.setAttribute("stroke", color);
                        circle.setAttribute("stroke-width", "0.8");
                        tacticsLayer.appendChild(circle);

                        // Draw Player Back Number
                        if (ev.back_no) {
                            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                            text.setAttribute("x", sx); text.setAttribute("y", sy - 3);
                            text.setAttribute("fill", "#fff");
                            text.setAttribute("font-size", "3.2");
                            text.setAttribute("font-weight", "800");
                            text.setAttribute("text-anchor", "middle");
                            text.textContent = ev.back_no;
                            tacticsLayer.appendChild(text);
                        }
                    }

                    // --- 2. Render Timeline Stream Item ---
                    const periodStr = ev.PERIOD_ID === 1 ? '전반' : (ev.PERIOD_ID === 2 ? '후반' : '연장');
                    const timeStr = `${periodStr} ${ev.MIN_TIME || 0}' ${ev.SEC_TIME || 0}''`;
                    const labelName = CODE_MAP[code] || `액션코드: ${code}`;
                    const playerTag = ev.back_no ? `No.${ev.back_no}` : '팀 전체';
                    const xgBadge = ev.EXPECTED_GOAL ? `<span style="color:#00ff88; margin-left:8px;">xG: ${Number(ev.EXPECTED_GOAL).toFixed(3)}</span>` : '';

                    const item = document.createElement('div');
                    item.className = `timeline-event ${code === 'GL' ? 'goal' : (isShot ? 'shot' : '')}`;
                    item.innerHTML = `
                        <span class="event-time">${timeStr}</span>
                        <span class="event-desc"><strong>${playerTag}</strong> - ${labelName} ${xgBadge}</span>
                        <span class="event-meta">X:${ev.START_POINT_X || 0} Y:${ev.START_POINT_Y || 0}</span>
                    `;
                    timelineStream.appendChild(item);
                });

                // Update Metric Cards
                document.getElementById('stat-total').innerText = totalCount;
                document.getElementById('stat-shots').innerText = shotCount;
                document.getElementById('stat-passes').innerText = passCount;
                document.getElementById('stat-xg').innerText = cumulativeXg.toFixed(2);

                updateMiniRadar(shotCount, passCount, totalCount);

            } catch (err) {
                console.error("JSON Parse Error:", err);
                timelineStream.innerHTML = '<div style="text-align: center; color: var(--accent-red); padding: 40px 0;">JSON 데이터 구문 분석 실패. 올바른 배열 구조인지 확인해주세요.</div>';
            }
        }

        // Initialize and Update Chart.js Mini Radar
        function updateMiniRadar(shots, passes, total) {
            const ctx = document.getElementById('miniRadar').getContext('2d');
            if (radarChartObj) radarChartObj.destroy();

            radarChartObj = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['공격 적극성', '슈팅 효율', '패스 연계', '압도력', '빌드업 기여', '위협도'],
                    datasets: [{
                        label: '실측 매치 지표',
                        data: [
                            Math.min(100, total * 5),
                            Math.min(100, shots * 20),
                            Math.min(100, passes * 2),
                            Math.min(100, (shots + passes) * 3),
                            75,
                            Math.min(100, shots * 25)
                        ],
                        backgroundColor: 'rgba(0, 166, 81, 0.25)',
                        borderColor: '#00a651',
                        borderWidth: 2,
                        pointBackgroundColor: '#d8b53a',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#8b949e', font: { size: 10, weight: '700' } },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // High-Resolution Image Export for Community Upload
        async function exportDashboardImage() {
            const targetElement = document.getElementById('export-area');
            try {
                const canvas = await html2canvas(targetElement, {
                    backgroundColor: '#090d16',
                    scale: 2, // 2x high resolution rendering
                    useCORS: true
                });
                canvas.toBlob(async function(blob) {
                    const item = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item]);
                    alert('✨ 완벽한 프로페셔널 분석 리포트 이미지가 클립보드에 복사되었습니다! 에펨코리아, 락싸 등 커뮤니티 글 작성 창에서 Ctrl+V 하세요.');
                });
            } catch (err) {
                alert('이미지 내보내기 실패: ' + err);
            }
        }

        // Initial empty chart setup
        updateMiniRadar(0, 0, 0);
    </script>
</body>
</html>
