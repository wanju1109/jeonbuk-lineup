<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeonbuk Hyundai - Pro Analytics</title>
    <!-- Chart.js for Radar Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --jb-green: #00a651;
            --jb-green-dark: #004a27;
            --border-color: #30363d;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* Top Navigation & Filters */
        .top-nav {
            display: flex;
            gap: 15px;
            background: var(--bg-panel);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { font-size: 13px; color: var(--text-muted); }
        .filter-group select {
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
        }

        /* Temp Input Data Section */
        .data-input {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .data-input textarea {
            width: 100%; height: 60px; background: #000; color: #0f0; 
            border: 1px solid var(--border-color); padding: 10px; box-sizing: border-box;
        }
        .btn {
            background: var(--jb-green); color: white; border: none;
            padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        
        /* Main Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        /* Score Board */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .score-board h2 { margin: 0; color: var(--jb-green); font-size: 24px; }
        .score-board .score { font-size: 48px; font-weight: bold; margin: 0 20px; }
        
        /* Pitch Area */
        .pitch-container {
            background: #1e3525;
            border: 1px solid var(--jb-green-dark);
            height: 350px;
            border-radius: 8px;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Player Stats Area */
        .player-profile { text-align: center; }
        .player-profile img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--jb-green); }
        .player-profile h3 { margin: 10px 0 5px 0; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .stat-item { background: var(--bg-main); padding: 10px; border-radius: 6px; font-size: 13px; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--jb-green); display: block; }
        
        /* Radar Chart Container */
        .chart-container { height: 250px; margin-top: 20px; }

    </style>
</head>
<body>

    <!-- Dynamic Filter Navigation -->
    <div class="top-nav">
        <div class="filter-group">
            <label>대회</label>
            <select id="sel-tournament"><option>K LEAGUE 1</option></select>
        </div>
        <div class="filter-group">
            <label>연도</label>
            <!-- Options dynamically populated by JS -->
            <select id="sel-year"></select> 
        </div>
        <div class="filter-group">
            <label>라운드</label>
            <!-- Options dynamically populated by JS -->
            <select id="sel-round"></select> 
        </div>
        <div class="filter-group">
            <label>선수 포커스</label>
            <select id="sel-player">
                <option value="ALL">전체 선수 리포트</option>
            </select>
        </div>
    </div>

    <!-- Data Input -->
    <div class="data-input">
        <label style="font-size: 12px; color: #8b949e;">데이터 자동화 연동 전까지 임시로 사용할 JSON 입력기</label>
        <textarea id="rawData" placeholder="데이터를 붙여넣고 버튼을 누르면 모든 필터와 화면이 업데이트됩니다."></textarea>
        <button class="btn" onclick="processData()">분석 리포트 생성</button>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard" id="export-area">
        <!-- Left Panel: Match Data & Pitch -->
        <div class="panel">
            <div class="score-board">
                <div>
                    <h2>전북현대</h2>
                    <span style="font-size:12px; color:var(--text-muted);">HOME</span>
                </div>
                <div class="score">2 - 1</div>
                <div>
                    <h2 style="color:#ff4d4d;">상대팀</h2>
                    <span style="font-size:12px; color:var(--text-muted);">AWAY</span>
                </div>
            </div>
            <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom:10px;">패스 연결 네트워크 & 슈팅 궤적</h4>
            <div class="pitch-container" id="pitch-viz">
                <!-- SVG tactics will be drawn here -->
            </div>
        </div>

        <!-- Right Panel: Player Specific Stats -->
        <div class="panel">
            <div class="player-profile">
                <h3 id="player-name">선수를 선택하세요</h3>
                <span style="font-size: 12px; color: var(--text-muted);" id="player-role">포지션 정보</span>
                
                <div class="stat-grid">
                    <div class="stat-item">평점 <span class="stat-value" id="stat-rating">-</span></div>
                    <div class="stat-item">슈팅(유효) <span class="stat-value" id="stat-shot">-</span></div>
                    <div class="stat-item">패스 성공률 <span class="stat-value" id="stat-pass">-</span></div>
                    <div class="stat-item">키패스 <span class="stat-value" id="stat-key">-</span></div>
                </div>

                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let radarChartInstance = null;

        // Initialize Dynamic Select Options (No more hardcoded limits!)
        function initSelects() {
            const yearSelect = document.getElementById('sel-year');
            const currentYear = new Date().getFullYear();
            for(let y = currentYear; y >= 2013; y--) {
                yearSelect.add(new Option(y + "년", y));
            }

            const roundSelect = document.getElementById('sel-round');
            for(let r = 1; r <= 38; r++) {
                roundSelect.add(new Option(r + " 라운드", r + "R"));
            }
        }
        initSelects();

        // Process Data and Update UI dynamically
function processData() {
    const rawDataInput = document.getElementById('rawData').value.trim();
    let events = [];
    
    try {
        // 공백이거나 비어있을 경우 예외 처리
        if (!rawDataInput) {
            alert("입력된 데이터가 없습니다.");
            return;
        }
        
        events = JSON.parse(rawDataInput);
        if (!Array.isArray(events)) events = [events];
    } catch(e) {
        console.error("JSON Parse Error:", e);
        alert("JSON 형식이 아닙니다. 데이터 구조를 확인해주세요."); 
        return;
    }

    // 선수 드롭다운 동적 생성
    const playerSelect = document.getElementById('sel-player');
    playerSelect.innerHTML = '<option value="ALL">전체 선수 리포트</option>';
    
    const uniquePlayers = [...new Set(events.filter(e => e.back_no).map(e => e.back_no))];
    uniquePlayers.sort((a,b) => a - b).forEach(num => {
        playerSelect.add(new Option(`No.${num}`, num));
    });

    updateRadarChart();
    alert("✨ 분석 리포트가 성공적으로 생성되었습니다!");
}

        // Draw Chart.js Radar Chart
        function updateRadarChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            
            if(radarChartInstance) { radarChartInstance.destroy(); }

            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['공격', '슈팅', '패스', '드리블', '피지컬', '수비'],
                    datasets: [{
                        label: '선수 스탯',
                        data: [85, 70, 92, 88, 75, 60], // This would be calculated from real data
                        backgroundColor: 'rgba(0, 166, 81, 0.2)',
                        borderColor: '#00a651',
                        pointBackgroundColor: '#00a651',
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#c9d1d9', font: { size: 12 } },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
        
        // Initial empty chart rendering
        updateRadarChart();
    </script>
</body>
</html>
