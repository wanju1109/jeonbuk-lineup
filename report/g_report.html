<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeonbuk Hyundai - Pro Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --jb-green: #00a651;
            --jb-green-dark: #004a27;
            --border-color: #30363d;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        /* Top Navigation & Filters */
        .top-nav {
            display: flex;
            gap: 15px;
            background: var(--bg-panel);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .filter-group select {
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* Temp Input Data Section */
        .data-input {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .data-input textarea {
            width: 100%; height: 60px; background: #000; color: #0f0; 
            border: 1px solid var(--border-color); padding: 10px; box-sizing: border-box;
        }
        .btn {
            background: var(--jb-green); color: white; border: none;
            padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        
        /* Main Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        /* Score Board */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .score-board h2 { margin: 0; color: var(--jb-green); font-size: 24px; }
        .score-board .score { font-size: 48px; font-weight: bold; margin: 0 20px; }
        
        /* Pitch Area */
        .pitch-container {
            background: #1e3525;
            border: 1px solid var(--jb-green-dark);
            height: 350px;
            border-radius: 8px;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Player Stats Area */
        .player-profile { text-align: center; }
        .player-profile h3 { margin: 10px 0 5px 0; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .stat-item { background: var(--bg-main); padding: 10px; border-radius: 6px; font-size: 13px; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--jb-green); display: block; }
        
        .chart-container { height: 250px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Dynamic Filter Navigation with Smart Match Separation -->
    <div class="top-nav">
        <div class="filter-group">
            <label>대회</label>
            <select id="sel-tournament"><option>K LEAGUE 1 (2026)</option></select>
        </div>
        <div class="filter-group">
            <label>라운드 & 매치 선택</label>
            <select id="sel-round" onchange="onRoundChange()">
                <!-- Dynamically populated and separated by Played / Upcoming -->
            </select>
        </div>
        <div class="filter-group">
            <label>선수 포커스</label>
            <select id="sel-player">
                <option value="ALL">전체 선수 리포트</option>
            </select>
        </div>
    </div>

    <!-- Data Input -->
    <div class="data-input">
        <label style="font-size: 12px; color: #8b949e;">크롬 익스텐션 자동 연동 또는 수동 JSON 입력 영역</label>
        <textarea id="rawData" placeholder="데이터가 여기에 자동으로 들어옵니다..."></textarea>
        <button class="btn" onclick="processData()">분석 리포트 강제 갱신</button>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard" id="export-area">
        <div class="panel">
            <div class="score-board">
                <div>
                    <h2 id="home-team">전북현대</h2>
                    <span style="font-size:12px; color:var(--text-muted);">HOME</span>
                </div>
                <div class="score" id="match-score">2 - 1</div>
                <div>
                    <h2 id="away-team" style="color:#ff4d4d;">제주SK</h2>
                    <span style="font-size:12px; color:var(--text-muted);">AWAY</span>
                </div>
            </div>
            <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom:10px;" id="match-info-title">22라운드 경기 분석</h4>
            <div class="pitch-container" id="pitch-viz"></div>
        </div>

        <div class="panel">
            <div class="player-profile">
                <h3 id="player-name">전체 팀 통합 분석</h3>
                <span style="font-size: 12px; color: var(--text-muted);" id="player-role">전북 현대 모터스</span>
                
                <div class="stat-grid">
                    <div class="stat-item">평점 <span class="stat-value" id="stat-rating">8.1</span></div>
                    <div class="stat-item">슈팅(유효) <span class="stat-value" id="stat-shot">16 (7)</span></div>
                    <div class="stat-item">패스 성공률 <span class="stat-value" id="stat-pass">89%</span></div>
                    <div class="stat-item">키패스 <span class="stat-value" id="stat-key">10</span></div>
                </div>

                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock 2026 Season Schedule Data (Separating Played and Upcoming matches)
        const jeonbukSchedule2026 = [
            { round: 20, opponent: "대전하나시티즌", date: "2026-07-25", status: "played", score: "3-1", result: "승" },
            { round: 21, opponent: "울산 HD", date: "2026-08-01", status: "played", score: "0-0", result: "무" },
            { round: 22, opponent: "제주 유나이티드", date: "2026-08-08", status: "played", score: "2-1", result: "승" }, // Current benchmark
            { round: 23, opponent: "포항 스틸러스", date: "2026-08-16", status: "upcoming", score: "- : -", result: "예정" },
            { round: 24, opponent: "FC서울", date: "2026-08-23", status: "upcoming", score: "- : -", result: "예정" },
            { round: 25, opponent: "수원 FC", date: "2026-08-30", status: "upcoming", score: "- : -", result: "예정" }
        ];

        let radarChartInstance = null;

        // Initialize Round Selector with Grouping (Played vs Upcoming)
        function initRounds() {
            const roundSelect = document.getElementById('sel-round');
            roundSelect.innerHTML = '';

            // Group 1: Played Matches
            const playedGroup = document.createElement('optgroup');
            playedGroup.label = "🏁 치러진 경기 (Match Results)";

            // Group 2: Upcoming Matches
            const upcomingGroup = document.createElement('optgroup');
            upcomingGroup.label = "⏳ 진행 예정 경기 (Upcoming)";

            jeonbukSchedule2026.forEach(match => {
                const option = document.option || document.createElement('option');
                option.value = match.round;
                
                if (match.status === 'played') {
                    option.text = `${match.round}라운드 vs ${match.opponent} (${match.score} ${match.result})`;
                    playedGroup.appendChild(option);
                } else {
                    option.text = `${match.round}라운드 vs ${match.opponent} [경기 예정]`;
                    upcomingGroup.appendChild(option);
                }
            });

            roundSelect.appendChild(playedGroup);
            roundSelect.appendChild(upcomingGroup);

            // Default select round 22 (Jeonbuk vs Jeju)
            roundSelect.value = "22";
            onRoundChange();
        }

        // When user changes round, update scoreboard dynamically
        function onRoundChange() {
            const roundSelect = document.getElementById('sel-round');
            const selectedRoundNum = roundSelect.value;
            const match = jeonbukSchedule2026.find(m => m.round == selectedRoundNum);

            if (match) {
                document.getElementById('away-team').innerText = match.opponent;
                document.getElementById('match-score').innerText = match.score;
                document.getElementById('match-info-title').innerText = `${match.round}라운드 전북 vs ${match.opponent} 분석 리포트`;
                
                if(match.status === 'upcoming') {
                    document.getElementById('match-score').style.color = '#8b949e';
                } else {
                    document.getElementById('match-score').style.color = '#c9d1d9';
                }
            }
        }

        initRounds();

        // Process injected JSON data
        function processData() {
            const rawData = document.getElementById('rawData').value;
            let events = [];
            try {
                if(rawData.trim() !== '') {
                    events = JSON.parse(rawData);
                    if (!Array.isArray(events)) events = [events];
                    
                    const playerSelect = document.getElementById('sel-player');
                    playerSelect.innerHTML = '<option value="ALL">전체 선수 리포트</option>';
                    const uniquePlayers = [...new Set(events.filter(e => e.back_no).map(e => e.back_no))];
                    uniquePlayers.sort((a,b) => a - b).forEach(num => {
                        playerSelect.add(new Option(`No.${num}`, num));
                    });
                }
                alert("✨ 선택한 라운드 및 데이터가 성공적으로 반영되었습니다!");
            } catch(e) {
                alert("데이터 형식 에러가 발생했습니다.");
            }
        }

        function updateRadarChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if(radarChartInstance) { radarChartInstance.destroy(); }

            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['공격', '슈팅', '패스', '드리블', '피지컬', '수비'],
                    datasets: [{
                        label: '팀 전술 스탯',
                        data: [85, 70, 92, 88, 75, 60],
                        backgroundColor: 'rgba(0, 166, 81, 0.2)',
                        borderColor: '#00a651',
                        pointBackgroundColor: '#00a651',
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#c9d1d9', font: { size: 12 } },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
        updateRadarChart();
    </script>
</body>
</html>
