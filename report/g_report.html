<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeonbuk Hyundai - Pro Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --jb-green: #00a651;
            --jb-green-dark: #004a27;
            --border-color: #30363d;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .top-nav {
            display: flex;
            gap: 15px;
            background: var(--bg-panel);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { font-size: 13px; color: var(--text-muted); font-weight: bold; }
        .filter-group select {
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        .data-input {
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .data-input textarea {
            width: 100%; height: 60px; background: #000; color: #0f0; 
            border: 1px solid var(--border-color); padding: 10px; box-sizing: border-box; font-family: monospace;
        }
        .btn {
            background: var(--jb-green); color: white; border: none;
            padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .score-board h2 { margin: 0; color: var(--jb-green); font-size: 24px; }
        .score-board .score { font-size: 48px; font-weight: bold; margin: 0 20px; }
        
        /* Pitch Area with SVG support */
        .pitch-container {
            background: #28a745;
            border: 2px solid white;
            height: 380px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        svg { width: 100%; height: 100%; }

        .player-profile { text-align: center; }
        .player-profile h3 { margin: 10px 0 5px 0; }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            text-align: left;
        }
        .stat-item { background: var(--bg-main); padding: 10px; border-radius: 6px; font-size: 13px; }
        .stat-value { font-size: 18px; font-weight: bold; color: var(--jb-green); display: block; }
        
        .chart-container { height: 250px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="filter-group">
            <label>대회</label>
            <select id="sel-tournament"><option>K LEAGUE 1 (2026)</option></select>
        </div>
        <div class="filter-group">
            <label>라운드 & 매치 선택</label>
            <select id="sel-round" onchange="onRoundChange()"></select>
        </div>
        <div class="filter-group">
            <label>선수 포커스</label>
            <select id="sel-player" onchange="processData()">
                <option value="ALL">전체 선수 리포트</option>
            </select>
        </div>
    </div>

    <div class="data-input">
        <label style="font-size: 12px; color: #8b949e;">크롬 익스텐션 자동 연동 데이터 영역</label>
        <textarea id="rawData" placeholder="데이터가 여기에 자동으로 들어옵니다..."></textarea>
        <button class="btn" onclick="processData()">분석 리포트 갱신 및 궤적 그리기</button>
    </div>

    <div class="dashboard" id="export-area">
        <div class="panel">
            <div class="score-board">
                <div>
                    <h2 id="home-team">전북현대</h2>
                    <span style="font-size:12px; color:var(--text-muted);">HOME</span>
                </div>
                <div class="score" id="match-score">1 - 3</div>
                <div>
                    <h2 id="away-team" style="color:#ff4d4d;">제주 유나이티드</h2>
                    <span style="font-size:12px; color:var(--text-muted);">AWAY</span>
                </div>
            </div>
            <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom:10px;" id="match-info-title">22라운드 전북 vs 제주 유나이티드 분석 리포트</h4>
            
            <!-- Pitch Visualization Container -->
            <div class="pitch-container">
                <svg id="pitch-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <defs>
                        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d4d" />
                        </marker>
                        <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#d8b53a" />
                        </marker>
                    </defs>
                    <!-- Pitch Markings -->
                    <line x1="50" y1="0" x2="50" y2="100" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
                    <circle cx="50" cy="50" r="15" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <rect x="0" y="20" width="16.5" height="60" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <rect x="83.5" y="20" width="16.5" height="60" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
                    <g id="tactics-layer"></g>
                </svg>
            </div>
        </div>

        <div class="panel">
            <div class="player-profile">
                <h3 id="player-name">전체 팀 통합 분석</h3>
                <span style="font-size: 12px; color: var(--text-muted);" id="player-role">전북 현대 모터스</span>
                
                <div class="stat-grid">
                    <div class="stat-item">평점 <span class="stat-value" id="stat-rating">6.8</span></div>
                    <div class="stat-item">슈팅(유효) <span class="stat-value" id="stat-shot">12 (4)</span></div>
                    <div class="stat-item">패스 성공률 <span class="stat-value" id="stat-pass">84%</span></div>
                    <div class="stat-item">키패스 <span class="stat-value" id="stat-key">7</span></div>
                </div>

                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Corrected Schedule Data reflecting actual match results (e.g., Round 22 Jeju loss 1-3)
        const jeonbukSchedule2026 = [
            { round: 20, opponent: "대전하나시티즌", score: "3-1", status: "played" },
            { round: 21, opponent: "울산 HD", score: "0-0", status: "played" },
            { round: 22, opponent: "제주 유나이티드", score: "1-3", status: "played" }, // Corrected to 1-3 loss
            { round: 23, opponent: "포항 스틸러스", score: "- : -", status: "upcoming" },
            { round: 24, opponent: "FC서울", score: "- : -", status: "upcoming" }
        ];

        let radarChartInstance = null;

        function initRounds() {
            const roundSelect = document.getElementById('sel-round');
            roundSelect.innerHTML = '';

            const playedGroup = document.createElement('optgroup');
            playedGroup.label = "🏁 치러진 경기";
            const upcomingGroup = document.createElement('optgroup');
            upcomingGroup.label = "⏳ 진행 예정 경기";

            jeonbukSchedule2026.forEach(match => {
                const option = document.createElement('option');
                option.value = match.round;
                if (match.status === 'played') {
                    option.text = `${match.round}라운드 vs ${match.opponent} (${match.score})`;
                    playedGroup.appendChild(option);
                } else {
                    option.text = `${match.round}라운드 vs ${match.opponent} [예정]`;
                    upcomingGroup.appendChild(option);
                }
            });

            roundSelect.appendChild(playedGroup);
            roundSelect.appendChild(upcomingGroup);
            roundSelect.value = "22"; // Default to Jeju match
            onRoundChange();
        }

        function onRoundChange() {
            const roundNum = document.getElementById('sel-round').value;
            const match = jeonbukSchedule2026.find(m => m.round == roundNum);
            if (match) {
                document.getElementById('away-team').innerText = match.opponent;
                document.getElementById('match-score').innerText = match.score;
                document.getElementById('match-info-title').innerText = `${match.round}라운드 전북 vs ${match.opponent} 분석 리포트`;
            }
        }

        initRounds();

        // Process Injected Data and Render on Pitch SVG
        function processData() {
            const rawData = document.getElementById('rawData').value;
            const selectedPlayer = document.getElementById('sel-player').value;
            let events = [];

            const tacticsLayer = document.getElementById('tactics-layer');
            tacticsLayer.innerHTML = ''; // Clear previous drawings

            try {
                if (rawData.trim() !== '') {
                    events = JSON.parse(rawData);
                    if (!Array.isArray(events)) events = [events];

                    // Populate player dropdown if empty
                    const playerSelect = document.getElementById('sel-player');
                    if(playerSelect.options.length <= 1) {
                        const uniquePlayers = [...new Set(events.filter(e => e.back_no).map(e => e.back_no))];
                        uniquePlayers.sort((a,b) => a - b).forEach(num => {
                            playerSelect.add(new Option(`No.${num}`, num));
                        });
                    }

                    // Draw events on SVG pitch
                    events.forEach(event => {
                        if (selectedPlayer !== 'ALL' && String(event.back_no) !== selectedPlayer) return;
                        if (event.START_POINT_X === undefined) return;

                        const sx = event.START_POINT_X;
                        const sy = event.START_POINT_Y;
                        const ex = event.END_POINT_X !== undefined ? event.END_POINT_X : sx;
                        const ey = event.END_POINT_Y !== undefined ? event.END_POINT_Y : sy;

                        const isShot = event.TYPE_DETAIL_CD === 'MST' || event.TYPE_DETAIL_CD === 'GL' || event.TYPE_DETAIL_CD === 'ST';
                        const color = isShot ? '#ff4d4d' : '#d8b53a';
                        const marker = isShot ? 'url(#arrow-red)' : 'url(#arrow-gold)';

                        // Draw line
                        if (sx !== ex || sy !== ey) {
                            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                            line.setAttribute("x1", sx); line.setAttribute("y1", sy);
                            line.setAttribute("x2", ex); line.setAttribute("y2", ey);
                            line.setAttribute("stroke", color);
                            line.setAttribute("stroke-width", "0.8");
                            line.setAttribute("marker-end", marker);
                            tacticsLayer.appendChild(line);
                        }

                        // Draw dot
                        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                        circle.setAttribute("cx", sx); circle.setAttribute("cy", sy);
                        circle.setAttribute("r", "2.5");
                        circle.setAttribute("fill", "#002e18");
                        circle.setAttribute("stroke", color);
                        circle.setAttribute("stroke-width", "0.8");
                        tacticsLayer.appendChild(circle);

                        // Draw back number text
                        if (event.back_no) {
                            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                            text.setAttribute("x", sx); text.setAttribute("y", sy - 3.5);
                            text.setAttribute("fill", "white");
                            text.setAttribute("font-size", "3.5");
                            text.setAttribute("font-weight", "bold");
                            text.setAttribute("text-anchor", "middle");
                            text.textContent = event.back_no;
                            tacticsLayer.appendChild(text);
                        }
                    });
                }
            } catch(e) {
                console.error("Rendering error:", e);
            }

            updateRadarChart();
        }

        function updateRadarChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if(radarChartInstance) { radarChartInstance.destroy(); }

            radarChartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['공격', '슈팅', '패스', '드리블', '피지컬', '수비'],
                    datasets: [{
                        label: '전술 스탯',
                        data: [75, 65, 84, 80, 70, 65],
                        backgroundColor: 'rgba(0, 166, 81, 0.2)',
                        borderColor: '#00a651',
                        pointBackgroundColor: '#00a651',
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#c9d1d9', font: { size: 12 } },
                            ticks: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
        updateRadarChart();
    </script>
</body>
</html>
