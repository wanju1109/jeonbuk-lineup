<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전북 현대 FM 전술판</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 15px 0;
            color: #00e676;
            font-weight: 900;
            letter-spacing: -1px;
            text-align: center;
        }

        .top-bar {
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #333;
        }

        .top-bar label {
            font-size: 14px;
            font-weight: 700;
            color: #aaa;
        }

        .top-bar select {
            background-color: #2a2a2a;
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid #444;
            outline: none;
            cursor: pointer;
        }

        /* Layout Container */
        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 440px;
        }

        /* Pitch Styles */
        #pitch-wrapper {
            background: linear-gradient(180deg, #1b5e20, #2e7d32, #1b5e20);
            border: 4px solid #ffffff;
            border-radius: 12px;
            position: relative;
            width: 440px;
            height: 620px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #pitch {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* SVG layer for tactics arrows */
        #movement-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 440px;
            height: 620px;
            pointer-events: none; /* Allows clicking players through the SVG */
            z-index: 2;
        }

        .pitch-line {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 1;
        }
        .center-line { top: 50%; left: 0; width: 100%; height: 0; }
        .center-circle { top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box.top { top: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-top: none; }
        .penalty-box.bottom { bottom: 0; left: 50%; width: 200px; height: 100px; transform: translateX(-50%); border-bottom: none; }

        .position-slot {
            position: absolute;
            width: 52px;
            height: 62px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.7);
            background-color: rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            cursor: pointer;
            z-index: 3;
        }
        .position-slot.selected {
            border: 3px solid #ffeb3b;
            background-color: rgba(255, 235, 59, 0.3);
        }

        /* Tactics Panel Styles */
        #tactics-panel {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .tactics-header {
            color: #00e676;
            font-size: 16px;
            margin: 0 0 10px 0;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        #formation-desc {
            font-size: 12px;
            color: #bbb;
            margin-bottom: 15px;
            line-height: 1.5;
            background: #222;
            padding: 10px;
            border-radius: 6px;
        }

        .role-selector-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .role-item {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
        }

        .role-item label {
            display: block;
            font-size: 11px;
            color: #00e676;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .role-item select {
            width: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px;
            font-size: 11px;
        }

        .role-desc {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            line-height: 1.3;
        }

        /* Bench Styles */
        #bench {
            width: 340px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            height: 900px;
            box-sizing: border-box;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        #bench h3 {
            margin: 0 0 15px 0;
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            font-size: 16px;
            color: #00e676;
        }

        .position-group { margin-bottom: 15px; }
        .position-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
            border-left: 3px solid #00e676;
            padding-left: 8px;
            font-weight: bold;
        }
        
        .sub-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            justify-items: center;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 65px;
            cursor: grab;
            z-index: 10;
        }
        .player-card.selected-card {
            outline: 3px solid #ffeb3b;
            border-radius: 8px;
            background-color: rgba(255, 235, 59, 0.2);
        }
        .player-card:active { cursor: grabbing; }
        .player-img, .player-info, .player-placeholder { pointer-events: none; }

        .player-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00e676;
            background-color: #fff;
        }

        .player-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #00e676;
            background-color: #004d40;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .player-info {
            background-color: rgba(20, 20, 20, 0.9);
            color: #ffffff;
            font-size: 10px;
            padding: 3px 5px;
            border-radius: 4px;
            margin-top: 3px;
            white-space: nowrap;
            text-align: center;
            font-weight: bold;
            border: 1px solid #444;
            max-width: 62px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .starter {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #00e676; }
    </style>
</head>

    <div class="top-bar">

                { id: "SS", name: "섀도우 스트라이커 (SS)", desc: "최전방 공격수가 빈 공간을 만들면 그곳으로 적극적으로 침투하여 득점을 올립니다.", path: "straight", dx: 0, dy: -18 },
                { id: "AP", name: "전진 플레이메이커 (AP)", desc: "상대 수비와 미드필드 사이 공간에서 활동하며 공격진에게 창의적인 패스를 공급합니다.", path: "hold", dx: 0, dy: 0 }
            ],
            "CM": [
                { id: "CM", name: "중앙 미드필더 (CM)", desc: "중앙에서 공수 밸런스를 맞추며 상황에 맞게 유동적으로 지원과 공격을 오갑니다.", path: "straight", dx: 0, dy: -8 },
                { id: "BBM", name: "박스 투 박스 (BBM)", desc: "엄청난 체력을 바탕으로 우리 진영부터 상대 페널티 박스까지 쉴 새 없이 오갑니다.", path: "straight", dx: 0, dy: -15 },
                { id: "MEZ", name: "메짤라 (MEZ)", desc: "중앙과 측면 사이의 하프 스페이스를 적극적으로 공략하는 공격적인 미드필더입니다.", path: "cut-inside", dx: "wide", dy: -12 },
                { id: "CAR", name: "카릴레로 (CAR)", desc: "중원의 좌우 측면 공간을 커버하며 공수 밸런스를 잡아주는 헌신적인 역할입니다.", path: "hold", dx: 0, dy: 0 }
            ],
            "DM": [
                { id: "DM", name: "수비형 미드필더 (DM)", desc: "포백을 든든하게 보호하고 중원에서 공을 탈취하는 기본에 충실한 역할입니다.", path: "hold", dx: 0, dy: 0 },
                { id: "DLP", name: "딥라잉 플레이메이커 (DLP)", desc: "후방 깊숙한 곳에서 정교한 패스를 배급하며 팀 공격의 템포를 조절합니다.", path: "hold", dx: 0, dy: 0 },
                { id: "BWM", name: "볼 위닝 미드필더 (BWM)", desc: "상대를 끈질기게 압박하여 공을 빼앗는 데 집중하는 수비형 미드필더입니다.", path: "straight", dx: 0, dy: -5 },
                { id: "HB", name: "하프백 (HB)", desc: "빌드업 시 센터백 사이로 깊숙이 내려와 후방 3백을 형성하며 안정감을 더합니다.", path: "straight", dx: 0, dy: 8 }
            ],
            "WB": [
                { id: "WB", name: "윙백 (WB)", desc: "터치라인을 따라 활발히 오르내리며 측면 공격과 수비를 모두 책임집니다.", path: "straight", dx: 0, dy: -20 },
                { id: "CWB", name: "완성형 윙백 (CWB)", desc: "측면 공격의 핵심으로, 수비보다는 적극적인 오버래핑과 크로스에 집중합니다.", path: "straight", dx: 0, dy: -25 }
            ],
            "FB": [
                { id: "FB", name: "풀백 (FB)", desc: "측면 수비를 최우선으로 하면서도 기회가 생기면 전방으로 올라가 측면을 지원합니다.", path: "straight", dx: 0, dy: -12 },
                { id: "IWB", name: "인버티드 윙백 (IWB)", desc: "공격 시 터치라인이 아닌 중앙 미드필드 지역으로 좁혀 들어와 중원 싸움에 힘을 보탭니다.", path: "cut-inside", dx: "center", dy: -12 },
                { id: "IFB", name: "인버티드 풀백 (IFB)", desc: "공격 시 중앙 수비수 자리로 이동하여 후방 빌드업을 돕고 안정적인 3백을 만듭니다.", path: "cut-inside", dx: "center", dy: 5 }
            ],
            "CB": [
                { id: "CD", name: "중앙 수비수 (CD)", desc: "기본적인 수비 임무에 충실하며 위험 지역에서 공을 걷어내 라인을 보호합니다.", path: "hold", dx: 0, dy: 0 },
                { id: "BPD", name: "공격형 수비수 (BPD)", desc: "수비 임무는 물론, 발밑 기술을 활용해 전방으로 정확한 패스를 찔러 빌드업을 주도합니다.", path: "straight", dx: 0, dy: -5 },
                { id: "WCB", name: "측면 중앙 수비수 (WCB)", desc: "3백에서 측면으로 넓게 벌려 풀백처럼 오버래핑하거나 측면 빈 공간을 방어합니다.", path: "cut-inside", dx: "wide", dy: -8 }
            ],
            "GK": [
                { id: "GK", name: "골키퍼 (GK)", desc: "안전하게 골문을 지키고 위험을 최소화하며 가까운 수비수에게 패스합니다.", path: "hold", dx: 0, dy: 0 },
                { id: "SK", name: "스위퍼 키퍼 (SK)", desc: "페널티 박스 바깥으로 나와 수비 뒷공간을 커버하고 역습의 시작점이 됩니다.", path: "straight", dx: 0, dy: -6 }
            ]
        };

        // State variables
        let currentFormation = "4-3-1-2";
        let selectedPlayerId = null;
        let slotRoles = {}; 

        function initRolesForFormation() {
            slotRoles = {};
            const slots = formations[currentFormation];
            slots.forEach(slot => {
                if (roleData[slot.type]) {
                    slotRoles[slot.id] = roleData[slot.type][0].id;
                }
            });
        }

        function assignPlayerToSlot(playerId, slotId) {
            squad.forEach(p => { if (p.slotId === slotId) p.slotId = null; });
            squad.forEach(p => { if (p.id === playerId) p.slotId = slotId; });
            selectedPlayerId = null;
            render();
        }

        // Draw movement paths in SVG
        function drawArrows() {
            const group = document.getElementById('arrows-group');
            group.innerHTML = ''; 
            const slots = formations[currentFormation];
            
            const pitchW = 440;
            const pitchH = 620;

            slots.forEach(slot => {
                const roleId = slotRoles[slot.id];
                if (!roleData[slot.type]) return; 
                
                const roleOpts = roleData[slot.type].find(r => r.id === roleId);
                if (!roleOpts || roleOpts.path === "hold") return; 

                // Coordinates in percentage
                const startX = slot.x;
                const startY = slot.y;
                let endX = startX;
                let endY = startY + roleOpts.dy;

                // Adjust X for curved paths
                if (roleOpts.dx === "center") {
                    endX = startX < 50 ? startX + 15 : (startX > 50 ? startX - 15 : startX);
                } else if (roleOpts.dx === "wide") {
                    endX = startX < 50 ? startX - 15 : (startX > 50 ? startX + 15 : startX);
                } else {
                    endX = startX + roleOpts.dx;
                }

                // Convert to exact pixels for SVG Path drawing
                const sX = (startX / 100) * pitchW;
                const sY = (startY / 100) * pitchH;
                const eX = (endX / 100) * pitchW;
                const eY = (endY / 100) * pitchH;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                let dString = "";

                if (roleOpts.path === "cut-inside") {
                    // Create a curve (Quadratic Bezier)
                    const midY = sY + ((eY - sY) * 0.5);
                    dString = `M ${sX} ${sY} Q ${sX} ${midY}, ${eX} ${eY}`;
                } else {
                    // Create a straight line
                    dString = `M ${sX} ${sY} L ${eX} ${eY}`;
                }

                path.setAttribute('d', dString);
                path.setAttribute('stroke', '#ffeb3b');
                path.setAttribute('stroke-width', '3');
                path.setAttribute('stroke-dasharray', '6,5');
                path.setAttribute('fill', 'transparent');
                path.setAttribute('marker-end', 'url(#arrowhead)');
                
                group.appendChild(path);
            });
        }

        function renderTacticsPanel() {
            document.getElementById('formation-desc').innerHTML = formationInfo[currentFormation];
            const selectorGroup = document.getElementById('role-selectors');
            selectorGroup.innerHTML = '';
            
            const slots = formations[currentFormation];
            slots.forEach(slot => {
                if (!roleData[slot.type]) return;

                const wrapper = document.createElement('div');
                wrapper.className = 'role-item';
                
                const label = document.createElement('label');
                label.innerText = slot.label;
                wrapper.appendChild(label);

                const select = document.createElement('select');
                roleData[slot.type].forEach(role => {
                    const option = document.createElement('option');
                    option.value = role.id;
                    option.innerText = role.name;
                    if (slotRoles[slot.id] === role.id) option.selected = true;
                    select.appendChild(option);
                });

                const descDiv = document.createElement('div');
                descDiv.className = 'role-desc';
                const currentRole = roleData[slot.type].find(r => r.id === slotRoles[slot.id]);
                descDiv.innerText = currentRole ? currentRole.desc : '';

                select.onchange = (e) => {
                    slotRoles[slot.id] = e.target.value;
                    const newRole = roleData[slot.type].find(r => r.id === e.target.value);
                    descDiv.innerText = newRole.desc;
                    drawArrows(); 
                };

                wrapper.appendChild(select);
                wrapper.appendChild(descDiv);
                selectorGroup.appendChild(wrapper);
            });
        }

        function render() {
            const pitch = document.getElementById('pitch');
            document.querySelectorAll('.position-slot, #pitch .player-card').forEach(el => el.remove());
            ['GK', 'DF', 'MF', 'FW'].forEach(pos => {
                document.getElementById(`sub-list-${pos}`).innerHTML = '';
            });

            // Render Slots
            const slots = formations[currentFormation];
            slots.forEach(slot => {
                const slotEl = document.createElement('div');
                slotEl.className = 'position-slot';
                if (selectedPlayerId !== null) slotEl.classList.add('selected');
                slotEl.dataset.slotId = slot.id;
                slotEl.style.left = slot.x + '%';
                slotEl.style.top = slot.y + '%';
                slotEl.innerText = slot.label;

                slotEl.onclick = (e) => {
                    e.stopPropagation();
                    if (selectedPlayerId !== null) assignPlayerToSlot(selectedPlayerId, slot.id);
                };

                slotEl.ondragover = (e) => e.preventDefault();
                slotEl.ondrop = (e) => {
                    e.preventDefault();
                    const playerId = parseInt(e.dataTransfer.getData('playerId'));
                    if (!isNaN(playerId)) assignPlayerToSlot(playerId, slot.id);
                };

                pitch.appendChild(slotEl);
            });

            // Render Players
            const sortedSquad = [...squad].sort((a, b) => parseInt(a.backNo) - parseInt(b.backNo));

            sortedSquad.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                if (player.id === selectedPlayerId) card.classList.add('selected-card');
                card.draggable = true;

                card.onclick = (e) => {
                    e.stopPropagation();
                    if (player.slotId) {
                        if (selectedPlayerId !== null && selectedPlayerId !== player.id) {
                            assignPlayerToSlot(selectedPlayerId, player.slotId);
                        } else {
                            player.slotId = null;
                            selectedPlayerId = null;
                            render();
                        }
                    } else {
                        selectedPlayerId = (selectedPlayerId === player.id) ? null : player.id;
                        render();
                    }
                };

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('playerId', player.id);
                    selectedPlayerId = player.id;
                };

                card.ondragover = (e) => { if (player.slotId) e.preventDefault(); };
                card.ondrop = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (player.slotId) {
                        const incomingId = parseInt(e.dataTransfer.getData('playerId'));
                        if (!isNaN(incomingId) && incomingId !== player.id) {
                            assignPlayerToSlot(incomingId, player.slotId);
                        }
                    }
                };

                if (player.img) {
                    const img = document.createElement('img');
                    img.src = player.img;
                    img.className = 'player-img';
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'player-placeholder';
                    placeholder.innerText = player.name;
                    card.appendChild(placeholder);
                }

                const info = document.createElement('div');
                info.className = 'player-info';
                info.innerText = `${player.backNo}. ${player.name}`;
                card.appendChild(info);

                if (player.slotId) {
                    const targetSlot = document.querySelector(`.position-slot[data-slot-id="${player.slotId}"]`);
                    if (targetSlot) {
                        card.classList.add('starter');
                        card.style.left = targetSlot.style.left;
                        card.style.top = targetSlot.style.top;
                        pitch.appendChild(card);
                        targetSlot.style.color = 'transparent'; 
                    } else {
                        player.slotId = null;
                    }
                } else {
                    const targetList = document.getElementById(`sub-list-${player.pos}`);
                    if (targetList) targetList.appendChild(card);
                }
            });

            drawArrows();
        }

        function changeFormation() {
            const select = document.getElementById('formation-select');
            currentFormation = select.value;
            squad.forEach(p => p.slotId = null); 
            selectedPlayerId = null;
            initRolesForFormation();
            renderTacticsPanel();
            render();
        }

        function handleBenchClick(e) {
            if (selectedPlayerId !== null) {
                const player = squad.find(p => p.id === selectedPlayerId);
                if (player) player.slotId = null;
                selectedPlayerId = null;
                render();
            }
        }
        
        const bench = document.getElementById('bench');
        bench.ondragover = (e) => e.preventDefault();
        bench.ondrop = (e) => {
            e.preventDefault();
            const playerId = parseInt(e.dataTransfer.getData('playerId'));
            const player = squad.find(p => p.id === playerId);
            if (player) {
                player.slotId = null;
                render();
            }
        };

        // Init
        initRolesForFormation();
        renderTacticsPanel();
        render();
    </script>
</body>
