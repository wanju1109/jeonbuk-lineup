name: newspaper daily (전주성 조간)

on:
  schedule:
    # 06:17 KST 시작 (정각은 GitHub 스케줄이 몰려 지연이 잦다) → 기사 생성 후 07:00 KST에 에버그린 게시
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "발행일 YYYY-MM-DD (비우면 오늘 KST)"
        required: false
        default: ""
      post:
        description: "에버그린에 올리기 (no / dry-run / yes)"
        required: false
        default: "dry-run"

permissions:
  contents: write

concurrency:
  group: newspaper-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "anthropic>=2.1,<3" "requests>=2.31"

      - name: Decide issue date
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          [ -z "$D" ] && D="$(date +%F)"
          if [[ "$D" < "2026-10-23" ]]; then echo "제1호(2026-10-23) 이전 날짜는 발행하지 않습니다"; exit 1; fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          POST="${{ github.event.inputs.post }}"
          [ "${{ github.event_name }}" = "schedule" ] && POST="yes"
          echo "post=$POST" >> "$GITHUB_OUTPUT"

      - name: Build context (기록·게시판)
        env:
          EVERGREEN_ID: ${{ secrets.EVERGREEN_ID }}
          EVERGREEN_PW: ${{ secrets.EVERGREEN_PW }}
          CHUGGU_ID: ${{ secrets.CHUGGU_ID }}
          CHUGGU_PW: ${{ secrets.CHUGGU_PW }}
        run: python newspaper/scripts/build_context.py --date "${{ steps.d.outputs.date }}" --out "$RUNNER_TEMP/ctx.json"

      - name: Write issue (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python newspaper/scripts/generate_issue.py --context "$RUNNER_TEMP/ctx.json"

      - name: Commit issue
        id: c
        run: |
          NO=$(python -c "import json;print(json.load(open('$RUNNER_TEMP/ctx.json'))['no'])")
          echo "no=$NO" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newspaper/issues
          git commit -m "chore(newspaper): 전주성 조간 제${NO}호" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Wait until 07:00 KST
        if: steps.d.outputs.post == 'yes' && github.event_name == 'schedule'
        run: |
          now=$(date +%s); target=$(date -d "$(date +%F) 07:00" +%s)
          [ "$now" -lt "$target" ] && sleep $((target - now)) || true

      - name: Post to Evergreen
        if: steps.d.outputs.post != 'no'
        env:
          EVERGREEN_ID: ${{ secrets.EVERGREEN_ID }}
          EVERGREEN_PW: ${{ secrets.EVERGREEN_PW }}
          EVERGREEN_CATEGORY: ${{ vars.EVERGREEN_CATEGORY }}
        run: |
          if [ "${{ steps.d.outputs.post }}" = "yes" ]; then
            python newspaper/scripts/post_evergreen.py --no "${{ steps.c.outputs.no }}" --wait-pages
            git add newspaper/issues/posted.json
            git commit -m "chore(newspaper): 제${{ steps.c.outputs.no }}호 에버그린 게시 기록" && { for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done; } || true
          else
            python newspaper/scripts/post_evergreen.py --no "${{ steps.c.outputs.no }}" --dry-run
          fi
