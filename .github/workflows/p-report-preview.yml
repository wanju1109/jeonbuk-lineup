name: p_report preview build

on:
  schedule:
    # Every 3 hours — catch the 48h window for upcoming Jeonbuk fixtures.
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Preview window hours (default 48)"
        required: false
        default: "48"
      year:
        description: "Season year (blank = current)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh schedule (Jeonbuk collect light)
        env:
          KLEAGUE_YEAR: ${{ github.event.inputs.year }}
          KLEAGUE_MEET_SEQ: "1"
          KLEAGUE_TEAM: "전북"
          KLEAGUE_ROUND: ""
        run: |
          set -e
          if [ -z "$KLEAGUE_YEAR" ]; then
            export KLEAGUE_YEAR="$(TZ=Asia/Seoul date +%Y)"
          fi
          # Schedule refresh only — chalk for unfinished games is skipped by collector.
          python c_report/scripts/collect_chalkboard.py || true

      - name: Build preview payloads
        env:
          PREVIEW_HOURS: ${{ github.event.inputs.hours || '48' }}
          KLEAGUE_YEAR: ${{ github.event.inputs.year }}
        run: |
          set -e
          if [ -z "$KLEAGUE_YEAR" ]; then
            export KLEAGUE_YEAR="$(TZ=Asia/Seoul date +%Y)"
          fi
          if [ -z "$PREVIEW_HOURS" ]; then
            export PREVIEW_HOURS=48
          fi
          python p_report/scripts/build_preview.py

      - name: Commit preview data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p_report/data c_report/data || true
          if git diff --staged --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "chore(p_report): refresh match preview within 48h window"
          git push
