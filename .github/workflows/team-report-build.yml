name: team report build

on:
  schedule:
    # Every day 02:10 KST — after proto results and player dossiers land.
    - cron: "10 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-report-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build K League club dossiers
        run: python team_report/scripts/build_team_report.py

      - name: Commit team report data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team_report/data || true
          if git diff --staged --quiet; then
            echo "No team report changes"
            exit 0
          fi
          git commit -m "chore(team_report): refresh K League club season dossiers"
          git push
